  id: "m1", title: "Le bilan et le compte de résultat", time: "25 min",
  sub: "Patrimoine, actif / passif, charges / produits : les deux documents que tout le reste alimente.",
  lesson: [
    { h: "Le bilan : une photo du patrimoine", html: `
<p>Le bilan décrit <b>ce que l'entreprise possède</b> et <b>ce qu'elle doit</b> à une date donnée, en général le 31 décembre. Il a deux colonnes qui sont toujours égales.</p>
<ul>
<li><b>Actif</b> (à gauche) : les emplois, ce que l'entreprise détient. Actif immobilisé (bâtiments, machines, matériel), puis actif circulant (stocks, créances clients, banque, caisse).</li>
<li><b>Passif</b> (à droite) : les ressources, d'où vient l'argent. Capitaux propres (capital apporté, réserves, résultat), puis dettes (emprunts, fournisseurs, dettes fiscales et sociales).</li>
</ul>
<div class="note"><b>Règle.</b> Actif = Passif, toujours. Chaque ressource finance un emploi : l'argent qu'on a (actif) vient forcément de quelque part (passif).</div>` },
    { h: "Trois opérations, trois bilans", html: `
<p>Une SARL se crée avec <span class="mono">50 000 €</span> de capital versé en banque. Bilan : Banque 50 000 à l'actif, Capital 50 000 au passif.</p>
<p>Elle achète une machine <span class="mono">20 000 €</span> payée comptant. L'actif se réorganise : Machine 20 000 + Banque 30 000. Le passif ne bouge pas.</p>
<p>Elle emprunte <span class="mono">10 000 €</span>. Actif : Banque 40 000 + Machine 20 000 = 60 000. Passif : Capital 50 000 + Emprunt 10 000 = 60 000.</p>` },
    { h: "Le compte de résultat : le film de l'exercice", html: `
<p>Sur un exercice (12 mois), l'entreprise consomme des <b>charges</b> (achats, loyers, salaires, intérêts) et génère des <b>produits</b> (ventes, prestations). La différence est le <b>résultat</b>.</p>
<ul>
<li>Produits &gt; charges : <b>bénéfice</b>. Il enrichit l'entreprise et vient grossir les capitaux propres au passif du bilan.</li>
<li>Charges &gt; produits : <b>perte</b>. Elle vient en moins des capitaux propres.</li>
</ul>
<div class="note"><b>Lien entre les deux.</b> Le résultat de l'exercice apparaît dans les deux documents : en bas du compte de résultat, et dans les capitaux propres du bilan. C'est ce qui garde le bilan équilibré.</div>` },
    { h: "Vocabulaire à fixer", html: `
<ul>
<li><b>Créance</b> : somme qu'un client nous doit (actif). <b>Dette</b> : somme que nous devons (passif).</li>
<li><b>Immobilisation</b> : bien durable utilisé plus d'un an (actif immobilisé). <b>Stock</b> : bien destiné à être vendu ou consommé (actif circulant).</li>
<li><b>Disponibilités</b> : banque et caisse.</li>
<li><b>Exercice</b> : période de 12 mois entre deux bilans.</li>
</ul>` },

    { type: "qcm", q: "Quelle égalité est vraie dans tout bilan ?", opts: ["Actif = Passif", "Produits = Charges", "Capitaux propres = Dettes", "Actif = Capitaux propres"], a: 0,
      why: "Les ressources (passif) financent les emplois (actif). Les deux colonnes sont donc toujours égales. Produits et charges ne sont égaux que si le résultat est nul." },
    { type: "qcm", q: "Un emprunt contracté auprès de la banque figure :", opts: ["À l'actif, en disponibilités", "Au passif, dans les dettes", "Au passif, dans les capitaux propres", "Dans les charges"], a: 1,
      why: "L'emprunt est une ressource externe qu'il faudra rembourser : c'est une dette (compte 164). L'argent reçu, lui, va à l'actif en banque." },
    { type: "tri", q: "Classez chaque élément dans la bonne partie du bilan.", cats: ["Actif immobilisé", "Actif circulant", "Capitaux propres", "Dettes"],
      items: [["Matériel informatique", 0], ["Stock de marchandises", 1], ["Capital social", 2], ["Dette envers un fournisseur", 3], ["Créance sur un client", 1], ["Emprunt bancaire", 3], ["Solde du compte en banque", 1], ["Réserves", 2]],

    { type: "calc", q: "Total de l'actif : 180 000 €. Total des dettes : 110 000 €. Quel est le montant des capitaux propres ?", a: 70000, unit: "€",
      why: "Passif = Actif = 180 000. Capitaux propres = Passif − Dettes = 180 000 − 110 000 = 70 000 €." },

      why: "Le client nous doit de l'argent : c'est un droit que nous détenons, donc un actif. Comme il sera encaissé à court terme, il est circulant." },
  ]

{
  id: "m2", title: "Le plan comptable et la partie double", time: "35 min",
  sub: "Les 7 classes du PCG, le sens débit / crédit et vos premières écritures.",
  lesson: [
    { h: "Les 7 classes du Plan comptable général", html: `
<p>Chaque compte porte un numéro dont le <b>premier chiffre</b> indique la classe. Les classes 1 à 5 sont des comptes de <b>bilan</b>, les classes 6 et 7 des comptes de <b>résultat</b>.</p>
<ul>
<li><b>1</b> Capitaux : capital <code>101</code>, réserves <code>106</code>, résultat <code>120</code>, emprunts <code>164</code>.</li>
<li><b>2</b> Immobilisations : matériel industriel <code>2154</code>, informatique <code>2183</code>, amortissements <code>28…</code>.</li>
<li><b>3</b> Stocks : marchandises <code>37</code>, matières <code>31</code>.</li>
<li><b>4</b> Tiers : fournisseurs <code>401</code>, clients <code>411</code>, personnel <code>421</code>, État et TVA <code>44…</code>.</li>
<li><b>5</b> Financiers : banque <code>512</code>, caisse <code>530</code>.</li>
<li><b>6</b> Charges : achats <code>60</code>, services extérieurs <code>61/62</code>, personnel <code>64</code>, financières <code>66</code>, dotations <code>68</code>.</li>
<li><b>7</b> Produits : ventes <code>70</code>, financiers <code>76</code>, exceptionnels <code>77</code>, reprises <code>78</code>.</li>
</ul>
<p>La numérotation est décimale : plus le numéro est long, plus le compte est précis (<code>4</code> → <code>44</code> → <code>445</code> → <code>44566</code>).</p>` },
    { h: "Débit à gauche, crédit à droite", html: `
<p>Tout compte a deux colonnes. <b>Débit</b> à gauche, <b>crédit</b> à droite. Le sens dépend de la nature du compte :</p>
<ul>
<li>Comptes d'<b>actif</b> (classes 2, 3, 5, clients) et de <b>charges</b> (classe 6) : ils <b>augmentent au débit</b>.</li>
<li>Comptes de <b>passif</b> (classe 1, fournisseurs, dettes) et de <b>produits</b> (classe 7) : ils <b>augmentent au crédit</b>.</li>
</ul>
<div class="note"><b>Mnémonique.</b> Débit = emploi (ce que l'opération donne ou utilise), à gauche comme l'actif. Crédit = ressource (d'où ça vient), à droite comme le passif.</div>
<p>Le piège classique : la <b>banque</b>. Quand de l'argent <i>entre</i>, on <b>débite</b> 512. Quand il <i>sort</i>, on <b>crédite</b> 512. C'est l'inverse du relevé que vous envoie votre banque, car la banque tient le compte de son point de vue.</p>` },
    { h: "La partie double", html: `
<p>Toute opération touche au moins deux comptes et le <b>total des débits égale le total des crédits</b>. C'est ce qui garantit que le bilan reste équilibré.</p>
<p>Exemple : achat de fournitures de bureau <span class="mono">200 €</span> payé par chèque (on ignore la TVA pour l'instant).</p>`,
      entry: [E("6064", 200, 0), E("512", 0, 200)], lib: "Achat de fournitures, chèque n° 118" },
    { h: "Lire une écriture", html: `
<p>Dans un journal, les comptes débités sont écrits en premier et alignés à gauche ; les comptes crédités sont décalés (traditionnellement précédés de « à »). Les montants sont dans deux colonnes séparées.</p>
<p>Exemple : les associés apportent <span class="mono">30 000 €</span> versés sur le compte bancaire de la société.</p>`,
      entry: [E("512", 30000, 0), E("101", 0, 30000)], lib: "Apport en capital" },
  ],
  exercises: [
    { type: "tri", q: "À quelle classe appartient chaque compte ?", cats: ["1 Capitaux", "2 Immobilisations", "3 Stocks", "4 Tiers", "5 Financiers", "6 Charges", "7 Produits"],
      items: [["512 Banque", 4], ["401 Fournisseurs", 3], ["607 Achats de marchandises", 5], ["2183 Matériel informatique", 1], ["101 Capital", 0], ["707 Ventes de marchandises", 6], ["37 Stocks de marchandises", 2], ["164 Emprunts", 0], ["641 Rémunérations du personnel", 5], ["411 Clients", 3]],
      why: "Le premier chiffre du numéro donne la classe. Les emprunts (164) sont en classe 1 avec les capitaux : ce sont des ressources durables." },
    { type: "qcm", q: "Un compte d'actif (banque, matériel, clients) augmente :", opts: ["Au débit", "Au crédit", "Des deux côtés", "Cela dépend du montant"], a: 0,
      why: "Les emplois augmentent au débit. Quand on reçoit de l'argent, 512 est débité ; quand on acquiert une machine, 2154 est débité." },
    { type: "qcm", q: "Un compte de produit (ventes) augmente :", opts: ["Au débit", "Au crédit", "Jamais, il reste fixe", "Au débit si le client paie comptant"], a: 1,

    { type: "qcm", q: "Un client règle sa facture par chèque. Quelle est l'écriture ?", opts: ["Débit 411 Clients, crédit 512 Banque", "Débit 512 Banque, crédit 411 Clients", "Débit 707 Ventes, crédit 512 Banque", "Débit 512 Banque, crédit 707 Ventes"], a: 1,
      why: "L'argent entre : 512 est débité. La créance s'éteint : 411 (compte d'actif) diminue, donc est crédité. La vente (707) avait déjà été enregistrée lors de la facturation." },
    { type: "ecriture", q: "Achat de fournitures de bureau pour 350 €, payé par carte bancaire. On ignore la TVA.", lib: "Fournitures de bureau",
      palette: ["6064", "512", "401", "607"], sol: [[E("6064", 350, 0), E("512", 0, 350)]],

    { type: "ecriture", q: "Les associés apportent 40 000 € en capital, versés sur le compte bancaire de la société.", lib: "Apport en capital",
      palette: ["101", "512", "164", "120"], sol: [[E("512", 40000, 0), E("101", 0, 40000)]],
      why: "La banque reçoit l'argent (débit 512). La ressource vient des associés : le capital (101) augmente au crédit." },
    { type: "ecriture", q: "La banque verse un emprunt de 15 000 € sur le compte de l'entreprise.", lib: "Déblocage de l'emprunt",
      palette: ["164", "512", "661", "101"], sol: [[E("512", 15000, 0), E("164", 0, 15000)]],
      why: "L'argent entre (débit 512). La dette envers la banque naît : 164 est crédité. Les intérêts (661) viendront plus tard, à chaque échéance." },
    { type: "qcm", q: "Le solde du compte 401 Fournisseurs est normalement :", opts: ["Débiteur", "Créditeur", "Nul", "Égal au solde de 411"], a: 1,
      why: "401 est une dette : il augmente au crédit lors des factures reçues et diminue au débit lors des paiements. Il reste créditeur tant qu'on doit de l'argent." },
    { type: "qcm", q: "Les classes 6 et 7 alimentent :", opts: ["Le bilan uniquement", "Le compte de résultat", "La déclaration de TVA", "Le plan de trésorerie"], a: 1,
      why: "Charges (6) et produits (7) constituent le compte de résultat. Leur solde, le résultat, est ensuite reporté au bilan dans les capitaux propres." },
    { type: "ecriture", q: "L'entreprise règle 2 300 € à un fournisseur par virement, pour une facture reçue le mois dernier.", lib: "Règlement fournisseur",
      palette: ["401", "512", "607", "44566"], sol: [[E("401", 2300, 0), E("512", 0, 2300)]],
      why: "La dette diminue : 401 est débité. L'argent sort : 512 est crédité. L'achat et la TVA ont été enregistrés lors de la réception de la facture, pas au paiement." },
  ]
},

  id: "m3", title: "Achats, ventes et TVA", time: "45 min",
  sub: "Factures d'achat et de vente, TVA collectée et déductible, réductions, déclaration.",
  lesson: [
    { h: "La TVA : collectée pour l'État, jamais une charge", html: `
<p>L'entreprise facture la TVA à ses clients (<b>TVA collectée</b>, <code>44571</code>) et paie la TVA à ses fournisseurs (<b>TVA déductible</b>, <code>44566</code> sur biens et services, <code>44562</code> sur immobilisations). Elle reverse la différence à l'État.</p>
<ul>
<li>Taux normal <b>20 %</b> ; intermédiaire 10 % ; réduit 5,5 % ; particulier 2,1 %.</li>
<li>HT × 1,20 = TTC. TTC ÷ 1,20 = HT. TVA = HT × 20 %.</li>
</ul>
<div class="note"><b>Conséquence.</b> Les charges et les produits sont enregistrés <b>hors taxes</b>. Les comptes de tiers (401, 411) sont enregistrés <b>TTC</b>, car c'est ce qui se paie.</div>` },
    { h: "Facture d'achat", html: `
<p>Réception d'une facture de marchandises : <span class="mono">4 000 € HT</span>, TVA 20 % = 800, TTC 4 800.</p>`,

    { h: "Facture de vente", html: `
<p>Vente de marchandises : <span class="mono">10 000 € HT</span>, TVA 2 000, TTC 12 000. Le client paiera à 30 jours.</p>`,

<ul>
<li><b>Rabais, remise, ristourne</b> (réductions commerciales) <i>portées sur la facture</i> : on enregistre directement le <b>net commercial</b>. Aucun compte spécifique.</li>
<li>Réductions commerciales accordées <i>après</i> la facture (avoir) : <code>609</code> chez l'acheteur, <code>709</code> chez le vendeur.</li>
<li><b>Escompte de règlement</b> (réduction financière pour paiement rapide) : <code>665</code> Escomptes accordés (charge) chez le vendeur, <code>765</code> Escomptes obtenus (produit) chez l'acheteur. La TVA se calcule sur le net financier.</li>
</ul>` },
    { h: "La déclaration de TVA", html: `
<p>Chaque mois : TVA à décaisser = TVA collectée − TVA déductible. On solde les comptes de TVA et on constate la dette en <code>44551</code>. Si la déductible dépasse la collectée, l'excédent va en <code>44567</code> Crédit de TVA.</p>
<p>Exemple : collectée 9 600, déductible ABS 5 200, déductible immobilisations 1 400 → 3 000 à décaisser.</p>`,
      entry: [E("44571", 9600, 0), E("44566", 0, 5200), E("44562", 0, 1400), E("44551", 0, 3000)], lib: "Déclaration de TVA du mois" },

    { type: "calc", q: "Un achat de 2 500 € HT au taux de 20 %. Quel est le montant de la TVA ?", a: 500, unit: "€", why: "2 500 × 20 % = 500 €. Le TTC est donc 3 000 €." },
    { type: "calc", q: "Une facture TTC de 1 800 € au taux de 20 %. Quel est le montant HT ?", a: 1500, unit: "€", why: "HT = TTC ÷ 1,20 = 1 800 ÷ 1,2 = 1 500 €. Erreur classique : retirer 20 % du TTC donne 1 440, ce qui est faux." },
    { type: "ecriture", q: "Réception d'une facture de marchandises : 4 000 € HT, TVA 20 %. Paiement à 30 jours.", lib: "Facture fournisseur",

    { type: "ecriture", q: "Vente de prestations de services : 2 000 € HT, TVA 20 %, à crédit.", lib: "Facture de prestation",

    { type: "calc", q: "TVA collectée du mois : 9 600 €. TVA déductible sur biens et services : 5 200 €. TVA déductible sur immobilisations : 1 400 €. Quel est le montant de la TVA à décaisser ?", a: 3000, unit: "€",
      why: "9 600 − 5 200 − 1 400 = 3 000 €. Si le résultat avait été négatif, on aurait un crédit de TVA (44567) à reporter." },
    { type: "ecriture", q: "Enregistrez la déclaration de TVA : collectée 9 600 €, déductible ABS 5 200 €, déductible immobilisations 1 400 €.", lib: "Déclaration de TVA",

    { h: "Les flux de trésorerie", html: `
<p>Chèque, virement, carte : <code>512</code> Banque. Espèces : <code>530</code> Caisse. Un encaissement client débite 512 et crédite 411. Un paiement fournisseur débite 401 et crédite 512.</p>
<p>Pour un mouvement entre la caisse et la banque, le PCG recommande le compte de passage <code>580</code> Virements internes, qui évite les doubles comptages. En exercice simple, on passe souvent directement : débit 530, crédit 512 pour un retrait d'espèces.</p>` },
    { h: "Les services extérieurs (61 / 62)", html: `

<li><code>613</code> Locations, <code>615</code> Entretien, <code>616</code> Assurances (sans TVA), <code>6226</code> Honoraires, <code>623</code> Publicité, <code>626</code> Téléphone et poste, <code>6061</code> Électricité.</li>
<li>Même logique que les achats : charge HT au débit, TVA déductible au débit, 401 ou 512 au crédit selon que la facture est réglée plus tard ou immédiatement.</li>

<p>Exemple : loyer du mois, <span class="mono">1 200 € HT</span> + 240 de TVA, prélevé en banque.</p>`,

    { h: "La paie, version simplifiée", html: `
<p>Le salaire <b>brut</b> est la charge de rémunération (<code>641</code>). On en retient les <b>cotisations salariales</b> dues aux organismes (<code>431</code>) ; le reste est le <b>net à payer</b> (<code>421</code>). L'employeur supporte en plus des <b>cotisations patronales</b> (<code>645</code>), également dues à <code>431</code>.</p>
<p>Exemple : bruts 20 000, cotisations salariales 4 400, cotisations patronales 8 400.</p>`,
      entry: [E("641", 20000, 0), E("645", 8400, 0), E("421", 0, 15600), E("431", 0, 12800)], lib: "Paie du mois" },
    { h: "Les échéances d'emprunt", html: `
<p>Chaque échéance mélange deux choses : le <b>remboursement du capital</b>, qui réduit la dette (débit <code>164</code>), et les <b>intérêts</b>, qui sont une charge financière (débit <code>661</code>). Le total sort de la banque.</p>`,
      entry: [E("164", 2000, 0), E("661", 300, 0), E("512", 0, 2300)], lib: "Échéance d'emprunt" },
  ],
  exercises: [
    { type: "ecriture", q: "Encaissement d'un chèque de 3 600 € d'un client, en règlement de sa facture.", lib: "Encaissement client",
      palette: ["512", "411", "707", "530"], sol: [[E("512", 3600, 0), E("411", 0, 3600)]],
      why: "L'argent entre (débit 512), la créance s'éteint (crédit 411)." },
    { type: "ecriture", q: "Facture de loyer : 1 200 € HT, TVA 20 %, prélevée directement sur le compte bancaire.", lib: "Loyer",
      palette: ["613", "44566", "512", "401"], sol: [[E("613", 1200, 0), E("44566", 240, 0), E("512", 0, 1440)]],
      why: "Charge HT en 613, TVA déductible en 44566, et comme le paiement est immédiat, la contrepartie est la banque et non 401." },
    { type: "ecriture", q: "Prime d'assurance annuelle de 900 € payée par virement. L'assurance n'est pas soumise à TVA.", lib: "Assurance",
      palette: ["616", "44566", "512", "613"], sol: [[E("616", 900, 0), E("512", 0, 900)]],
      why: "Les primes d'assurance sont hors champ de la TVA : aucune TVA déductible à enregistrer." },
    { type: "ecriture", q: "Paie du mois : salaires bruts 20 000 €, cotisations salariales 4 400 €, cotisations patronales 8 400 €. Enregistrez l'ensemble en une seule écriture.", lib: "Paie",
      palette: ["641", "645", "421", "431", "512"],
      sol: [[E("641", 20000, 0), E("645", 8400, 0), E("421", 0, 15600), E("431", 0, 12800)],
            [E("641", 20000, 0), E("645", 8400, 0), E("421", 0, 15600), E("431", 0, 4400), E("431", 0, 8400)]],
      why: "Net à payer = 20 000 − 4 400 = 15 600 (crédit 421). Dette envers les organismes = 4 400 + 8 400 = 12 800 (crédit 431). Charges : 641 pour le brut, 645 pour le patronal. Total débit = 28 400 = total crédit." },
    { type: "qcm", q: "Le net à payer aux salariés est enregistré :", opts: ["Au débit de 641", "Au crédit de 421", "Au crédit de 431", "Au débit de 512"], a: 1,
      why: "421 Personnel – Rémunérations dues est une dette envers les salariés, créditée à la paie et débitée au virement des salaires." },
    { type: "ecriture", q: "Échéance d'emprunt prélevée en banque : 2 000 € de capital et 300 € d'intérêts.", lib: "Échéance d'emprunt",
      palette: ["164", "661", "512", "1688"], sol: [[E("164", 2000, 0), E("661", 300, 0), E("512", 0, 2300)]],
      why: "Le capital remboursé réduit la dette (débit 164), les intérêts sont une charge financière (débit 661), le tout sort de la banque (crédit 512)." },
    { type: "calc", q: "Emprunt de 100 000 € au taux annuel de 3 %. Quel est le montant des intérêts de la première année ?", a: 3000, unit: "€", why: "100 000 × 3 % = 3 000 €. Les années suivantes, les intérêts se calculent sur le capital restant dû, donc ils diminuent." },
    { type: "qcm", q: "Retrait de 500 € d'espèces à la banque pour alimenter la caisse. Écriture directe :", opts: ["Débit 512, crédit 530", "Débit 530, crédit 512", "Débit 530, crédit 6064", "Débit 580, crédit 530"], a: 1,
      why: "La caisse reçoit (débit 530), la banque donne (crédit 512). Avec le compte de passage, on ferait 580/512 puis 530/580." },
    { type: "ecriture", q: "Facture de l'expert-comptable : honoraires 1 500 € HT, TVA 20 %, à payer le mois prochain.", lib: "Honoraires",
      palette: ["6226", "44566", "401", "512"], sol: [[E("6226", 1500, 0), E("44566", 300, 0), E("401", 0, 1800)]],

  ]
},
{
  id: "m5", title: "Immobilisations et amortissements", time: "50 min",
  sub: "Acquisition, amortissement linéaire et dégressif, valeur nette comptable, cession.",
  lesson: [
    { h: "Qu'est-ce qu'une immobilisation ?", html: `
<p>Un bien <b>durable</b> (utilisé plus d'un an) que l'entreprise <b>utilise</b> plutôt que de le vendre : machine, véhicule, ordinateur, mobilier, logiciel. Par tolérance fiscale, le petit matériel de moins de 500 € HT peut passer en charges.</p>
<p>Le <b>coût d'acquisition</b> = prix d'achat HT + frais directs (transport, installation, mise en service) − réductions commerciales. La TVA va en <code>44562</code> et la dette en <code>404</code> Fournisseurs d'immobilisations.</p>`,
      entry: [E("2154", 24000, 0), E("44562", 4800, 0), E("404", 0, 28800)], lib: "Acquisition d'une machine" },
    { h: "L'amortissement linéaire", html: `
<p>L'amortissement répartit le coût du bien sur sa <b>durée d'utilité</b>. C'est une <b>charge calculée</b> (pas de sortie d'argent) : débit <code>6811</code>, crédit <code>28xx</code>.</p>
<ul>
<li>Taux linéaire = 1 ÷ durée (5 ans → 20 %).</li>
<li>Annuité = base amortissable × taux. Base = coût − valeur résiduelle éventuelle.</li>
<li>La première année, <b>prorata temporis</b> à partir de la <b>mise en service</b> : en mois (9/12) ou en jours sur 360.</li>
<li>Le dernier exercice récupère le complément.</li>
</ul>
<p>Exemple : machine 24 000 €, 5 ans, mise en service le 1er janvier → 4 800 € par an.</p>`,
      entry: [E("6811", 4800, 0), E("28154", 0, 4800)], lib: "Dotation annuelle" },
    { h: "L'amortissement dégressif (fiscal)", html: `
<p>Autorisé pour certains biens neufs (matériel industriel notamment). Taux dégressif = taux linéaire × coefficient : <b>1,25</b> (3-4 ans), <b>1,75</b> (5-6 ans), <b>2,25</b> (plus de 6 ans). Il s'applique à la <b>valeur nette comptable</b> de début d'exercice, et le prorata se compte en mois depuis le <b>1er jour du mois d'acquisition</b>.</p>
<p>Quand le taux linéaire sur la durée restante dépasse le taux dégressif, on bascule en linéaire sur le reste.</p>` },
    { h: "VNC et cession", html: `
<p><b>Valeur nette comptable</b> = coût − amortissements cumulés. Quand on vend une immobilisation, deux écritures :</p>
<ul>
<li>Le <b>prix de cession</b> HT en produit exceptionnel <code>775</code>, TVA collectée, créance en <code>462</code> (ou 512).</li>
<li>La <b>sortie du bien</b> : on solde le compte d'immobilisation (crédit 2xx pour le coût) et son amortissement (débit 28xx), la différence (la VNC) passe en charge <code>675</code>.</li>
</ul>
<p>Avant cela, on comptabilise la dotation complémentaire du 1er janvier à la date de cession.</p>`,
      entry: [E("675", 6000, 0), E("28182", 24000, 0), E("2182", 0, 30000)], lib: "Sortie du véhicule cédé" },
  ],
  exercises: [
    { type: "qcm", q: "Un ordinateur acheté 1 500 € HT, destiné à être utilisé 4 ans, est :", opts: ["Une charge (6064)", "Une immobilisation (2183)", "Un stock (37)", "Une charge constatée d'avance (486)"], a: 1,
      why: "Bien durable utilisé par l'entreprise et au-dessus du seuil de 500 € HT : c'est une immobilisation, amortie sur sa durée d'utilité." },
    { type: "ecriture", q: "Acquisition d'une machine industrielle : 24 000 € HT, TVA 20 %, paiement à 60 jours.", lib: "Acquisition machine",
      palette: ["2154", "44562", "44566", "404", "401"], sol: [[E("2154", 24000, 0), E("44562", 4800, 0), E("404", 0, 28800)]],
      why: "Immobilisation au débit de 2154, TVA sur immobilisations en 44562 (pas 44566), dette envers le fournisseur d'immobilisations en 404 (pas 401)." },
    { type: "calc", q: "Machine de 24 000 €, amortie en linéaire sur 5 ans, mise en service le 1er janvier N. Dotation de l'exercice N ?", a: 4800, unit: "€", why: "Taux = 1/5 = 20 %. 24 000 × 20 % = 4 800 €. Année complète, pas de prorata." },
    { type: "calc", q: "Véhicule de 30 000 €, linéaire sur 5 ans, mis en service le 1er avril N. Dotation de l'exercice N (prorata en mois) ?", a: 4500, unit: "€", why: "30 000 × 20 % × 9/12 = 4 500 €. Neuf mois d'avril à décembre inclus." },
    { type: "ecriture", q: "Enregistrez la dotation annuelle de 4 800 € sur la machine industrielle.", lib: "Dotation aux amortissements",
      palette: ["6811", "28154", "2154", "512"], sol: [[E("6811", 4800, 0), E("28154", 0, 4800)]],
      why: "La charge calculée au débit de 6811, le cumul d'amortissement au crédit de 28154. Le compte 2154 reste au coût d'acquisition : on ne le diminue jamais directement." },
    { type: "calc", q: "Machine de 24 000 €, linéaire 5 ans depuis le 1er janvier N. Quelle est la valeur nette comptable au 31 décembre N+2 ?", a: 9600, unit: "€", why: "Trois dotations de 4 800 = 14 400 cumulés. VNC = 24 000 − 14 400 = 9 600 €." },
    { type: "calc", q: "Matériel industriel de 50 000 € acquis le 1er janvier, durée 5 ans, amortissement dégressif. Première annuité ?", a: 17500, unit: "€", why: "Taux linéaire 20 % × coefficient 1,75 = 35 %. 50 000 × 35 % = 17 500 €. La 2e annuité se calculera sur la VNC de 32 500." },
    { type: "qcm", q: "La dotation aux amortissements est :", opts: ["Une charge décaissée", "Une charge calculée, sans sortie de trésorerie", "Un produit exceptionnel", "Une dette fiscale"], a: 1,
      why: "Aucun paiement n'a lieu : la trésorerie est sortie à l'achat. La dotation ne fait qu'étaler ce coût sur les exercices d'utilisation. C'est pourquoi on la réintègre dans la CAF." },
    { type: "calc", q: "Un bien coûte 20 000 € et a une valeur résiduelle estimée de 2 000 €. Quelle est la base amortissable ?", a: 18000, unit: "€", why: "Base = coût − valeur résiduelle = 18 000 €. Cette base n'est retenue que si la valeur résiduelle est significative et mesurable." },
    { type: "ecriture", q: "Cession d'un véhicule : coût 30 000 €, amortissements cumulés (y compris la dotation complémentaire) 24 000 €. Enregistrez la sortie du bien de l'actif.", lib: "Sortie d'immobilisation",
      palette: ["675", "28182", "2182", "775", "462"], sol: [[E("675", 6000, 0), E("28182", 24000, 0), E("2182", 0, 30000)]],
      why: "On solde l'amortissement (débit 28182) et le compte d'immobilisation (crédit 2182). La VNC de 6 000 devient une charge exceptionnelle (675). Le prix de vente fait l'objet d'une écriture séparée en 775." },
    { type: "qcm", q: "Le véhicule précédent est vendu 8 000 € HT. Où va le prix de cession ?", opts: ["Au crédit de 2182", "Au crédit de 775 Produits des cessions d'éléments d'actif", "Au crédit de 707 Ventes de marchandises", "Au crédit de 28182"], a: 1,
      why: "Vendre une immobilisation n'est pas l'activité courante : le produit est exceptionnel (775). Ici, 8 000 de produit contre 6 000 de VNC : plus-value de 2 000." },
  ]
},
{
  id: "m6", title: "Stocks, dépréciations et provisions", time: "45 min",
  sub: "Variation de stock, créances douteuses, dépréciations d'actif et provisions pour risques.",
  lesson: [
    { h: "L'inventaire intermittent", html: `
<p>En cours d'année, les achats vont en <code>607</code> et le compte de stock <code>37</code> ne bouge pas. À la clôture, on <b>annule le stock initial</b> et on <b>constate le stock final</b> compté physiquement, via le compte <code>6037</code> Variation des stocks.</p>`,
      entry: [E("6037", 40000, 0), E("37", 0, 40000)], lib: "Annulation du stock initial" },
    { h: "Lire la variation de stock", html: `
<p>Variation (6037) = stock initial − stock final. Si le stock a augmenté, 6037 est <b>créditeur</b> : il diminue les charges, donc augmente le résultat. Logique : une partie des achats n'a pas été consommée.</p>
<p><b>Coût d'achat des marchandises vendues</b> = achats + stock initial − stock final.</p>
<p>Pour les produits finis, on utilise <code>355</code> et <code>7135</code> (production stockée), avec le signe inverse : stock final − stock initial.</p>`,
      entry: [E("37", 55000, 0), E("6037", 0, 55000)], lib: "Constatation du stock final" },
    { h: "Dépréciations", html: `
<p>Une <b>dépréciation</b> constate une perte de valeur <b>probable mais non définitive</b> d'un élément d'actif. C'est une charge calculée (<code>68…</code>) avec en contrepartie un compte en moins de l'actif (<code>29</code>, <code>39</code>, <code>49</code>).</p>
<ul>
<li>Stock : <code>68173</code> / <code>397</code>.</li>
<li>Client en difficulté : on reclasse d'abord la créance <b>TTC</b> en <code>416</code> Clients douteux, puis on déprécie le montant <b>HT</b> probablement perdu : <code>68174</code> / <code>491</code>. La TVA n'est pas dépréciée car elle sera récupérée.</li>
<li>Quand la situation s'améliore ou se dénoue : <b>reprise</b> <code>491</code> / <code>78174</code>.</li>
</ul>` },
    { h: "Provisions et créances perdues", html: `
<p>Une <b>provision</b> (classe 15) constate une <b>dette probable</b> : litige, garantie, amende. C'est un passif, pas une correction d'actif. Débit <code>6815</code>, crédit <code>1511</code>.</p>
<p>Quand une créance est <b>définitivement perdue</b>, on sort le client douteux : la perte HT en <code>654</code>, la TVA récupérée au débit de <code>44571</code>, le TTC au crédit de <code>416</code>. Puis on reprend la dépréciation devenue sans objet.</p>`,
      entry: [E("654", 2000, 0), E("44571", 400, 0), E("416", 0, 2400)], lib: "Créance irrécouvrable" },
  ],
  exercises: [
    { type: "calc", q: "Achats de marchandises de l'exercice : 300 000 €. Stock initial : 40 000 €. Stock final : 55 000 €. Coût d'achat des marchandises vendues ?", a: 285000, unit: "€", why: "300 000 + 40 000 − 55 000 = 285 000 €. Les 15 000 d'augmentation de stock n'ont pas été vendus, ils restent à l'actif." },
    { type: "ecriture", q: "À la clôture, annulez le stock initial de marchandises de 40 000 €.", lib: "Annulation stock initial",
      palette: ["6037", "37", "607", "355"], sol: [[E("6037", 40000, 0), E("37", 0, 40000)]],
      why: "Le stock initial disparaît de l'actif (crédit 37) et devient une charge via la variation (débit 6037)." },
    { type: "ecriture", q: "Constatez le stock final de marchandises compté à l'inventaire : 55 000 €.", lib: "Stock final",
      palette: ["37", "6037", "607", "7135"], sol: [[E("37", 55000, 0), E("6037", 0, 55000)]],
      why: "Le stock final entre à l'actif (débit 37) et vient en déduction des charges (crédit 6037). Solde de 6037 : 40 000 − 55 000 = −15 000, créditeur." },
    { type: "qcm", q: "Le stock final est supérieur au stock initial. Effet sur le résultat :", opts: ["Il diminue le résultat", "Il augmente le résultat", "Aucun effet", "Il augmente la TVA à décaisser"], a: 1,
      why: "6037 est créditeur : les charges de l'exercice diminuent d'autant, donc le résultat augmente. Une partie des achats est reportée sur l'exercice suivant." },
    { type: "calc", q: "Un client doit 3 600 € TTC (TVA 20 %) et risque de ne payer que la moitié. Montant de la dépréciation à constater ?", a: 1500, unit: "€", why: "Base HT = 3 600 ÷ 1,2 = 3 000. Perte probable 50 % → 1 500 €. La TVA n'est pas dépréciée : si la créance est perdue, l'État la rembourse." },
    { type: "ecriture", q: "Reclassez d'abord la créance de 3 600 € TTC de ce client en client douteux.", lib: "Client douteux",
      palette: ["416", "411", "491", "654"], sol: [[E("416", 3600, 0), E("411", 0, 3600)]],
      why: "Le reclassement se fait pour le montant TTC : la créance ne change pas de montant, seulement de catégorie." },
    { type: "ecriture", q: "Enregistrez la dépréciation de 1 500 € sur ce client douteux.", lib: "Dépréciation client",
      palette: ["68174", "491", "416", "654"], sol: [[E("68174", 1500, 0), E("491", 0, 1500)]],
      why: "Charge calculée au débit de 68174, dépréciation au crédit de 491 (qui viendra en moins des créances à l'actif du bilan)." },
    { type: "qcm", q: "Quelle est la différence entre une dépréciation et une provision ?", opts: ["Aucune, ce sont des synonymes", "La dépréciation diminue la valeur d'un actif ; la provision constate un passif probable", "La provision concerne les stocks, la dépréciation les clients", "La dépréciation est définitive, la provision est probable"], a: 1,
      why: "Dépréciation = correction en moins d'un élément d'actif (comptes 29, 39, 49). Provision = dette probable (classe 15). Les deux sont des charges calculées, réversibles par reprise." },
    { type: "ecriture", q: "Un litige avec un ancien salarié risque de coûter 5 000 €. Enregistrez la provision à la clôture.", lib: "Provision pour litige",
      palette: ["6815", "1511", "491", "421"], sol: [[E("6815", 5000, 0), E("1511", 0, 5000)]],
      why: "Dotation aux provisions d'exploitation au débit, provision pour litiges (passif) au crédit." },
    { type: "ecriture", q: "Un client douteux de 2 400 € TTC (HT 2 000, TVA 400) est en liquidation : la créance est définitivement perdue. Enregistrez la perte.", lib: "Créance irrécouvrable",
      palette: ["654", "44571", "416", "491", "68174"], sol: [[E("654", 2000, 0), E("44571", 400, 0), E("416", 0, 2400)]],
      why: "La perte HT en charge (654), la TVA est récupérée en diminuant la TVA collectée (débit 44571), le client douteux est soldé pour le TTC. La dépréciation existante sera ensuite reprise (491 / 78174)." },
    { type: "qcm", q: "Une dépréciation de stock se comptabilise :", opts: ["Débit 68173, crédit 397", "Débit 37, crédit 6037", "Débit 397, crédit 68173", "Débit 6037, crédit 397"], a: 0,
      why: "Charge calculée au débit (68173), compte de dépréciation au crédit (397). Le stock lui-même (37) reste à sa valeur d'inventaire." },
  ]
},
{
  id: "m7", title: "Clôture : régularisations et résultat", time: "50 min",
  sub: "Charges à payer, produits à recevoir, charges et produits constatés d'avance, détermination et affectation du résultat.",
  lesson: [
    { h: "Le principe d'indépendance des exercices", html: `
<p>Chaque exercice doit porter <b>toutes</b> ses charges et <b>tous</b> ses produits, et <b>rien que</b> les siens. À la clôture, on ajuste donc :</p>
<ul>
<li><b>Charges à payer</b> : consommées en N, pas encore facturées. Facture non parvenue : débit 6xx, débit <code>44586</code>, crédit <code>408</code>.</li>
<li><b>Produits à recevoir</b> : livrés en N, pas encore facturés. Facture à établir : débit <code>418</code>, crédit 7xx, crédit <code>44587</code>.</li>
<li><b>Charges constatées d'avance</b> (<code>486</code>) : déjà enregistrées mais concernant N+1. Débit 486, crédit 6xx (HT).</li>
<li><b>Produits constatés d'avance</b> (<code>487</code>) : déjà facturés mais concernant N+1. Débit 7xx, crédit 487.</li>
<li><b>Intérêts courus</b> sur emprunt : débit <code>661</code>, crédit <code>1688</code>.</li>
</ul>
<p>Toutes ces écritures sont <b>contre-passées</b> au 1er jour de N+1 pour que la facture réelle s'enregistre normalement.</p>` },
    { h: "Deux exemples", html: `
<p>Loyer trimestriel de 3 000 € payé le 1er décembre N pour décembre, janvier et février : 2 000 € concernent N+1.</p>`,
      entry: [E("486", 2000, 0), E("613", 0, 2000)], lib: "Charge constatée d'avance" },
    { h: "", html: `<p>Électricité de décembre consommée, facture non reçue : estimation 800 € HT, TVA 160.</p>`,
      entry: [E("6061", 800, 0), E("44586", 160, 0), E("408", 0, 960)], lib: "Facture non parvenue" },
    { h: "Déterminer le résultat", html: `
<p>Après les écritures d'inventaire, on dresse la <b>balance</b> (liste de tous les comptes avec leurs soldes ; total débits = total crédits). On solde ensuite tous les comptes 6 et 7 dans <code>120</code> (bénéfice) ou <code>129</code> (perte). Les comptes de bilan (1 à 5) sont reportés à nouveau en N+1.</p>` },
    { h: "Affecter le résultat (sociétés)", html: `
<p>L'assemblée décide de l'affectation du bénéfice : <b>réserve légale</b> (<code>1061</code>) obligatoire à 5 % du bénéfice jusqu'à ce qu'elle atteigne 10 % du capital, puis réserves facultatives, <b>dividendes</b> (<code>457</code>) et <b>report à nouveau</b> (<code>110</code>).</p>` },
  ],
  exercises: [
    { type: "ecriture", q: "Le 1er décembre N, un loyer trimestriel de 3 000 € (décembre à février) a été enregistré en 613. Passez l'écriture de régularisation au 31 décembre.", lib: "Charge constatée d'avance",
      palette: ["486", "613", "487", "408"], sol: [[E("486", 2000, 0), E("613", 0, 2000)]],
      why: "Janvier et février concernent N+1 : 2/3 × 3 000 = 2 000 € sortent des charges de N (crédit 613) et vont à l'actif en 486." },
    { type: "ecriture", q: "L'électricité de décembre (800 € HT, TVA 160 €) a été consommée mais la facture n'est pas arrivée. Régularisez.", lib: "Facture non parvenue",

<script>
// ---------- Utilitaires ----------
const fmt = n => new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 }).format(n);
const fmtAmt = n => n ? fmt(n) : "";
function parseNum(s) {
  if (s == null) return NaN;
  const t = String(s).replace(/[\s  €]/g, "").replace(",", ".");
  return t === "" ? NaN : Number(t);
}
const DAY = 86400000;
const todayKey = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }

// ---------- État et répétition espacée ----------
const KEY = "debit-credit.v1";
const INTERVALS = [1, 3, 7, 15, 30, 60];
let state = { cards: {}, done: {}, days: {} };
function load() { try { const s = localStorage.getItem(KEY); if (s) state = Object.assign({ cards: {}, done: {}, days: {} }, JSON.parse(s)); } catch (e) { } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { } refreshSaveBox(); }
function card(id) { return state.cards[id] || { s: 0, due: 0, n: 0 }; }
function record(id, ok) {
  const c = card(id);
  c.n = (c.n || 0) + 1;
  if (ok) { c.s = Math.min(c.s + 1, INTERVALS.length); c.due = Date.now() + INTERVALS[c.s - 1] * DAY; }
  else { c.s = 0; c.due = Date.now() + DAY; }
  state.cards[id] = c;
  const d = todayKey(); state.days[d] = (state.days[d] || 0) + 1;
  save(); updateBadge();
}
const ACQUIS = 3; // force à partir de laquelle un exercice compte comme acquis
function moduleMastery(m) {
  const tot = m.exercises.reduce((acc, e) => acc + Math.min(card(e.id).s, ACQUIS), 0);
  return tot / (m.exercises.length * ACQUIS);
}
function dueList() { const now = Date.now(); return Object.keys(EXO).filter(id => { const c = state.cards[id]; return c && c.n > 0 && c.due <= now; }); }
function updateBadge() { const b = document.getElementById("dueBadge"); const n = dueList().length; b.textContent = n; b.classList.toggle("zero", n === 0); }
function streak() {
  let n = 0; const d = new Date();
  if (!state.days[todayKey()]) d.setDate(d.getDate() - 1);
  while (state.days[d.toISOString().slice(0, 10)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- Rendu d'un journal ----------
function journalHTML(lines, lib, caption) {
  const debits = lines.filter(l => l.d), credits = lines.filter(l => l.c);
  const td = debits.reduce((a, l) => a + l.d, 0), tc = credits.reduce((a, l) => a + l.c, 0);
  const row = (l, cls) => `<tr class="${cls}"><td class="n">${esc(l.a)}</td><td class="lib">${esc(LABEL[l.a] || "")}</td><td class="amt">${fmtAmt(l.d)}</td><td class="amt">${fmtAmt(l.c)}</td></tr>`;
  return `<div class="jwrap"><table class="journal">${caption ? `<caption>${esc(caption)}</caption>` : ""}
<thead><tr><th>Compte</th><th>Intitulé</th><th style="text-align:right">Débit</th><th style="text-align:right">Crédit</th></tr></thead><tbody>
${debits.map(l => row(l, "debit")).join("")}${credits.map(l => row(l, "credit")).join("")}
${lib ? `<tr><td></td><td class="lib"><i class="muted">${esc(lib)}</i></td><td class="amt"></td><td class="amt"></td></tr>` : ""}
<tr class="total"><td></td><td class="lib">Totaux</td><td class="amt">${fmt(td)}</td><td class="amt">${fmt(tc)}</td></tr></tbody></table></div>`;
}

// ---------- Exercices ----------
// Rend un exercice dans `host` ; appelle onDone(ok) une fois le verdict rendu (ok = juste du premier coup).
function renderExercise(ex, host, onDone, meta) {
  host.innerHTML = "";
  const box = document.createElement("div"); box.className = "exo";
  box.innerHTML = `<div class="meta"><span class="eyebrow">${esc(meta || "")}</span><span class="progress">${{ qcm: "Question à choix", calc: "Calcul", tri: "Classement", ecriture: "Écriture au journal" }[ex.type]}</span></div><div class="q">${esc(ex.q)}</div><div class="body"></div><div class="fb"></div><div class="actions"></div>`;
  host.appendChild(box);
  const body = box.querySelector(".body"), fb = box.querySelector(".fb"), act = box.querySelector(".actions");
  let attempts = 0, finished = false;

  const verify = document.createElement("button"); verify.className = "btn"; verify.textContent = "Vérifier";
  const reveal = document.createElement("button"); reveal.className = "btn ghost"; reveal.textContent = "Voir la correction"; reveal.hidden = true;
  const next = document.createElement("button"); next.className = "btn"; next.textContent = "Suivant"; next.hidden = true;
  act.append(verify, reveal, next);

  function finish(ok, solutionHTML) {
    finished = true; verify.hidden = true; reveal.hidden = true; next.hidden = false; next.focus();
    const first = attempts === 1;
    const cls = ok ? "ok" : "bad";
    const head = ok ? (first ? "Juste du premier coup." : "Juste, après correction.") : "Voici la correction.";
    fb.innerHTML = `<div class="feedback ${cls}"><p><b>${head}</b></p>${solutionHTML || ""}<p>${ex.why}</p></div>`;
    onDone(ok && first);
  }
  function miss(msg) {
    fb.innerHTML = `<div class="feedback bad"><p><b>Pas encore.</b> ${msg}</p></div>`;
    reveal.hidden = false;
  }
  next.onclick = () => host.dispatchEvent(new CustomEvent("next", { bubbles: true }));

  if (ex.type === "qcm") {
    let chosen = -1;
    const order = shuffle(ex.opts.map((_, i) => i));
    const wrap = document.createElement("div"); wrap.className = "opts";
    order.forEach((oi, k) => {
      const b = document.createElement("button"); b.className = "opt"; b.type = "button"; b.dataset.i = oi; b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<span class="k">${"ABCD"[k]}</span><span>${esc(ex.opts[oi])}</span>`;
      b.onclick = () => { if (finished) return; chosen = oi; wrap.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", o === b ? "true" : "false")); };
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
    const showSolution = () => wrap.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (+o.dataset.i === ex.a) o.classList.add("right"); else if (+o.dataset.i === chosen) o.classList.add("wrong"); });
    verify.onclick = () => {
      if (chosen < 0) { toast("Choisissez une réponse."); return; }
      attempts++;
      if (chosen === ex.a) { showSolution(); finish(true); }
      else { wrap.querySelector(`[data-i="${chosen}"]`).classList.add("wrong"); miss("Cette réponse n'est pas la bonne. Vous pouvez en choisir une autre."); }
    };
    reveal.onclick = () => { attempts++; showSolution(); finish(false); };
  }

  if (ex.type === "calc") {
    body.innerHTML = `<div class="calc"><input id="calc-${ex.id}" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span class="unit">${esc(ex.unit || "")}</span></div>`;
    const inp = body.querySelector("input");
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (!finished) verify.click(); else next.click(); } });
    const tol = ex.tol ?? 0.5;
    verify.onclick = () => {
      const v = parseNum(inp.value);
      if (isNaN(v)) { toast("Saisissez un nombre."); return; }
      attempts++;
      if (Math.abs(v - ex.a) <= tol) { finish(true, `<p class="mono">Réponse : ${fmt(ex.a)} ${esc(ex.unit || "")}</p>`); }
      else miss(`${fmt(v)} n'est pas le résultat attendu. Revérifiez le calcul.`);
    };
    reveal.onclick = () => { attempts++; inp.value = fmt(ex.a); finish(false, `<p class="mono">Réponse : ${fmt(ex.a)} ${esc(ex.unit || "")}</p>`); };
    setTimeout(() => inp.focus(), 50);
  }

  if (ex.type === "tri") {
    const wrap = document.createElement("div"); wrap.className = "tri";
    const items = shuffle(ex.items);
    items.forEach((it, k) => {
      const r = document.createElement("div"); r.className = "tri-row";
      r.innerHTML = `<span>${esc(it[0])}</span><select id="tri-${ex.id}-${k}" aria-label="Catégorie pour ${esc(it[0])}"><option value="">Choisir…</option>${ex.cats.map((c, ci) => `<option value="${ci}">${esc(c)}</option>`).join("")}</select>`;
      r.dataset.a = it[1];
      wrap.appendChild(r);
    });
    body.appendChild(wrap);
    const grade = (lock) => { let all = true; wrap.querySelectorAll(".tri-row").forEach(r => { const s = r.querySelector("select"); const ok = s.value !== "" && +s.value === +r.dataset.a; r.classList.toggle("right", ok); r.classList.toggle("wrong", !ok); if (!ok) all = false; if (lock) { s.value = r.dataset.a; s.disabled = true; r.classList.add("right"); r.classList.remove("wrong"); } }); return all; };
    verify.onclick = () => {
      const empty = [...wrap.querySelectorAll("select")].some(s => s.value === "");
      if (empty) { toast("Classez tous les éléments."); return; }
      attempts++;
      if (grade(false)) { wrap.querySelectorAll("select").forEach(s => s.disabled = true); finish(true); }
      else miss("Les lignes marquées en rouge sont à revoir.");
    };
    reveal.onclick = () => { attempts++; grade(true); finish(false); };
  }

  if (ex.type === "ecriture") {
    const palette = shuffle(ex.palette);
    body.innerHTML = `<div class="eyebrow">Comptes disponibles</div><div class="palette">${palette.map(a => `<span class="chip"><b>${esc(a)}</b>${esc(LABEL[a] || "")}</span>`).join("")}</div>
<div class="jwrap"><table class="journal"><thead><tr><th>Compte</th><th>Intitulé</th><th style="text-align:right">Débit</th><th style="text-align:right">Crédit</th><th></th></tr></thead><tbody></tbody>
<tfoot><tr class="total"><td></td><td class="lib">Totaux</td><td class="amt" id="td-${ex.id}">0</td><td class="amt" id="tc-${ex.id}">0</td><td></td></tr></tfoot></table></div>
<div class="balance" id="bal-${ex.id}">Débit et crédit doivent être égaux.</div>
<div class="actions"><button class="btn quiet" type="button" id="add-${ex.id}">+ Ajouter une ligne</button></div>`;
    const tbody = body.querySelector("tbody");
    const addLine = () => {
      const k = tbody.children.length;
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="n" style="width:140px"><select id="acc-${ex.id}-${k}" aria-label="Compte"><option value="">—</option>${palette.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("")}</select></td><td class="lib muted"></td><td class="amt"><input class="amt-in" id="d-${ex.id}-${k}" inputmode="decimal" placeholder="" aria-label="Débit"></td><td class="amt"><input class="amt-in" id="c-${ex.id}-${k}" inputmode="decimal" placeholder="" aria-label="Crédit"></td><td class="del"><button type="button" aria-label="Supprimer la ligne">×</button></td>`;
      tr.querySelector("select").onchange = e => { tr.querySelector(".lib").textContent = LABEL[e.target.value] || ""; };
      tr.querySelector(".del button").onclick = () => { if (finished) return; tr.remove(); totals(); };
      tr.querySelectorAll("input").forEach(i => i.addEventListener("input", totals));
      tbody.appendChild(tr);
    };
    const readLines = () => [...tbody.children].map(tr => ({ a: tr.querySelector("select").value, d: parseNum(tr.querySelector('[id^="d-"]').value) || 0, c: parseNum(tr.querySelector('[id^="c-"]').value) || 0, tr })).filter(l => l.a || l.d || l.c);
    const totals = () => {
      const ls = readLines(); const td = ls.reduce((s, l) => s + l.d, 0), tc = ls.reduce((s, l) => s + l.c, 0);
      body.querySelector(`#td-${ex.id}`).textContent = fmt(td); body.querySelector(`#tc-${ex.id}`).textContent = fmt(tc);
      const bal = body.querySelector(`#bal-${ex.id}`);
      if (!td && !tc) { bal.textContent = "Débit et crédit doivent être égaux."; bal.className = "balance"; }
      else if (Math.abs(td - tc) < 0.005) { bal.textContent = "Équilibrée."; bal.className = "balance on"; }
      else { bal.textContent = `Écart : ${fmt(Math.abs(td - tc))}`; bal.className = "balance off"; }
    };
    body.querySelector(`#add-${ex.id}`).onclick = addLine;
    addLine(); addLine();
    const key = l => `${l.a}|${l.d > 0 ? "D" : "C"}|${Math.round((l.d || l.c) * 100)}`;
    const matches = (lines, sol) => {
      if (lines.length !== sol.length) return false;
      const pool = sol.map(key); for (const l of lines) { const i = pool.indexOf(key(l)); if (i < 0) return false; pool.splice(i, 1); } return true;
    };
    const solHTML = () => journalHTML(ex.sol[0], ex.lib, "Correction");
    verify.onclick = () => {
      const ls = readLines();
      if (!ls.length) { toast("Saisissez au moins deux lignes."); return; }
      if (ls.some(l => !l.a)) { toast("Chaque ligne doit avoir un compte."); return; }
      if (ls.some(l => (l.d && l.c) || (!l.d && !l.c))) { toast("Un montant par ligne, au débit ou au crédit."); return; }
      attempts++;
      const td = ls.reduce((s, l) => s + l.d, 0), tc = ls.reduce((s, l) => s + l.c, 0);
      if (Math.abs(td - tc) >= 0.005) { miss("L'écriture n'est pas équilibrée : total débit ≠ total crédit."); return; }
      if (ex.sol.some(s => matches(ls, s))) { tbody.querySelectorAll("input,select").forEach(i => i.disabled = true); finish(true); return; }
      // Marquer les lignes présentes dans la solution la plus proche
      const best = ex.sol[0]; const pool = best.map(key);
      ls.forEach(l => { const i = pool.indexOf(key(l)); l.tr.classList.remove("ok-line", "bad-line"); l.tr.classList.add(i >= 0 ? "ok-line" : "bad-line"); if (i >= 0) pool.splice(i, 1); });
      const missing = pool.length;
      miss(`L'écriture est équilibrée mais ne correspond pas à la solution attendue${missing ? ` (${missing} ligne${missing > 1 ? "s" : ""} manquante${missing > 1 ? "s" : ""} ou incorrecte${missing > 1 ? "s" : ""})` : ""}. Vérifiez les comptes et les montants HT / TTC.`);
    };
    reveal.onclick = () => { attempts++; tbody.querySelectorAll("input,select").forEach(i => i.disabled = true); finish(false, solHTML()); };
  }
}

// ---------- Vues ----------
const main = document.getElementById("main");
let view = { tab: "parcours" };

function nextModule() { return MODULES.find(m => moduleMastery(m) < 0.999) || null; }

function renderParcours() {
  const acquired = Object.values(EXO).filter(e => card(e.id).s >= ACQUIS).length;
  const total = Object.keys(EXO).length;
  const due = dueList().length;
  const nm = nextModule();
  const todayN = state.days[todayKey()] || 0;
  main.innerHTML = `
<div class="board">
  <div class="tile"><div class="big">${acquired}<span class="muted" style="font-size:1rem"> / ${total}</span></div><div class="lab">notions acquises</div></div>
  <div class="tile"><div class="big">${due}</div><div class="lab">révision${due > 1 ? "s" : ""} à faire aujourd'hui</div></div>
  <div class="tile"><div class="big">${streak()}</div><div class="lab">jour${streak() > 1 ? "s" : ""} d'affilée · ${todayN} réponse${todayN > 1 ? "s" : ""} aujourd'hui</div></div>
</div>
<p class="muted">Huit modules dans l'ordre où la comptabilité se construit : chaque module s'appuie sur le précédent. Faites la leçon puis les exercices ; les notions reviennent ensuite en révision à intervalles croissants (1, 3, 7, 15, 30, 60 jours). Une notion est acquise après trois réussites espacées.</p>
<div class="ledger">${MODULES.map((m, i) => {
    const mast = moduleMastery(m); const started = m.exercises.some(e => card(e.id).n > 0);
    const pill = mast >= 0.999 ? '<span class="pill done">acquis</span>' : (nm && nm.id === m.id ? '<span class="pill next">à faire maintenant</span>' : started ? '<span class="pill prog">en cours</span>' : '<span class="pill">à venir</span>');
    return `<button class="row" data-m="${m.id}"><span class="num">${i + 1}</span><span><span class="ttl">${esc(m.title)}</span><br><span class="sub">${esc(m.sub)}</span></span><span class="right">${pill}<div class="bar ${mast >= 0.999 ? "full" : ""}"><i style="width:${Math.round(mast * 100)}%"></i></div><span class="mono muted" style="font-size:.78rem">${m.exercises.length} exercices · ${m.time}</span></span></button>`;
  }).join("")}</div>`;
  main.querySelectorAll(".row").forEach(b => b.onclick = () => go({ tab: "module", id: b.dataset.m }));
}

function renderModule(id, startAt) {
  const m = MODULES.find(x => x.id === id); const idx = MODULES.indexOf(m);
  main.innerHTML = `<div class="crumb"><button id="back">← Parcours</button><span class="muted">Module ${idx + 1} / ${MODULES.length}</span></div><h2>${esc(m.title)}</h2><p class="muted">${esc(m.sub)}</p><div id="stage"></div>`;
  main.querySelector("#back").onclick = () => go({ tab: "parcours" });
  const stage = main.querySelector("#stage");
  const showLesson = () => {
    stage.innerHTML = `<div class="lesson">${m.lesson.map(s => `${s.h ? `<h3>${esc(s.h)}</h3>` : ""}${s.html}${s.entry ? journalHTML(s.entry, s.lib) : ""}`).join("")}</div>
<div class="actions"><button class="btn" id="startEx">Passer aux exercices (${m.exercises.length})</button></div>`;
    stage.querySelector("#startEx").onclick = () => { showExercises(); window.scrollTo({ top: 0 }); };
  };
  const showExercises = () => {
    let i = 0, score = 0;
    const order = m.exercises;
    stage.innerHTML = `<div class="crumb"><span class="progress" id="prog"></span><button id="toLesson">Revoir la leçon</button></div><div id="host"></div>`;
    stage.querySelector("#toLesson").onclick = showLesson;
    const host = stage.querySelector("#host");
    const step = () => {
      if (i >= order.length) { done(); return; }
      stage.querySelector("#prog").textContent = `Exercice ${i + 1} / ${order.length}`;
      renderExercise(order[i], host, ok => { record(order[i].id, ok); if (ok) score++; }, `Module ${idx + 1} · ${m.title}`);
    };
    host.addEventListener("next", () => { i++; step(); window.scrollTo({ top: Math.max(0, host.getBoundingClientRect().top + window.scrollY - 80) }); });
    const done = () => {
      state.done[m.id] = (state.done[m.id] || 0) + 1; save();
      const nm = MODULES[idx + 1];
      host.innerHTML = `<div class="exo"><h3 style="margin-top:0">Module terminé</h3><p>${score} exercice${score > 1 ? "s" : ""} sur ${order.length} réussi${score > 1 ? "s" : ""} du premier coup. Les notions ratées reviendront demain dans l'onglet Révisions ; les autres dans trois jours.</p>
<div class="actions">${nm ? `<button class="btn" id="goNext">Module suivant : ${esc(nm.title)}</button>` : ""}<button class="btn ghost" id="redo">Refaire les exercices</button><button class="btn quiet" id="toP">Retour au parcours</button></div></div>`;
      stage.querySelector("#prog").textContent = "Terminé";
      if (nm) host.querySelector("#goNext").onclick = () => go({ tab: "module", id: nm.id });
      host.querySelector("#redo").onclick = () => { i = 0; score = 0; step(); };
      host.querySelector("#toP").onclick = () => go({ tab: "parcours" });
    };
    step();
  };
  if (startAt === "exercises") showExercises(); else showLesson();
}

function renderRevisions() {
  const due = shuffle(dueList()).slice(0, 20);
  if (!due.length) {
    const upcoming = Object.entries(state.cards).filter(([, c]) => c.n > 0).sort((a, b) => a[1].due - b[1].due)[0];
    const when = upcoming ? Math.max(1, Math.ceil((upcoming[1].due - Date.now()) / DAY)) : null;
    main.innerHTML = `<h2>Révisions</h2><p>Rien à revoir pour le moment.</p>${when ? `<p class="muted">Prochaine révision dans ${when} jour${when > 1 ? "s" : ""}. D'ici là, avancez dans le parcours.</p>` : `<p class="muted">Les notions vues dans les modules apparaîtront ici à intervalles croissants. Commencez par le parcours.</p>`}<div class="actions"><button class="btn" id="toP">Aller au parcours</button></div>`;
    main.querySelector("#toP").onclick = () => go({ tab: "parcours" });
    return;
  }
  let i = 0, ok = 0;
  main.innerHTML = `<h2>Révisions du jour</h2><p class="muted">${due.length} notion${due.length > 1 ? "s" : ""} à revoir, mélangées entre les modules. Une bonne réponse espace la prochaine révision, une erreur la ramène à demain.</p><div class="crumb"><span class="progress" id="prog"></span></div><div id="host"></div>`;
  const host = main.querySelector("#host");
  const step = () => {
    if (i >= due.length) {
      main.querySelector("#prog").textContent = "Terminé";
      host.innerHTML = `<div class="exo"><h3 style="margin-top:0">Révisions terminées</h3><p>${ok} sur ${due.length} du premier coup.</p><div class="actions"><button class="btn" id="toP">Retour au parcours</button></div></div>`;
      host.querySelector("#toP").onclick = () => go({ tab: "parcours" });
      return;
    }
    const ex = EXO[due[i]]; const m = MODULES.find(x => x.id === ex.module);
    main.querySelector("#prog").textContent = `Révision ${i + 1} / ${due.length}`;
    renderExercise(ex, host, r => { record(ex.id, r); if (r) ok++; }, `Module ${ex.num} · ${m.title}`);
  };
  host.addEventListener("next", () => { i++; step(); window.scrollTo({ top: 0 }); });
  step();
}

function renderPlan() {
  main.innerHTML = `<h2>Plan comptable</h2><p class="muted">Les comptes utilisés dans le parcours, avec leur sens habituel (D = solde débiteur, C = créditeur). Le premier chiffre donne la classe.</p>
<div class="classes">${CLASSES.map(c => `<div class="cls"><div class="c">${c[0]}</div><b>${esc(c[1])}</b><br><span class="muted">${esc(c[2])}</span></div>`).join("")}</div>
<input class="search" id="q" type="search" placeholder="Rechercher un numéro ou un mot (ex. 445, amortissement, client)" autocomplete="off">
<div class="twrap"><table class="plan"><tbody id="planBody"></tbody></table></div>`;
  const body = main.querySelector("#planBody");
  const draw = q => {
    const t = (q || "").trim().toLowerCase();
    const rows = PLAN.filter(a => !t || a[0].startsWith(t) || a[1].toLowerCase().includes(t) || a[3].toLowerCase().includes(t));
    body.innerHTML = rows.length ? rows.map(a => `<tr><td class="n">${a[0]}</td><td><b>${esc(a[1])}</b><br><span class="muted" style="font-size:.85rem">${esc(a[3])}</span></td><td class="s">${a[2]}</td></tr>`).join("") : `<tr><td colspan="3" class="muted">Aucun compte ne correspond.</td></tr>`;
  };
  draw(""); main.querySelector("#q").addEventListener("input", e => draw(e.target.value));
}

function go(v) {
  view = v;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === (v.tab === "module" ? "parcours" : v.tab))));
  if (v.tab === "parcours") renderParcours();
  else if (v.tab === "module") renderModule(v.id, v.start);
  else if (v.tab === "revisions") renderRevisions();
  else if (v.tab === "plan") renderPlan();
  try { history.replaceState(null, "", "#" + (v.tab === "module" ? v.id : v.tab)); } catch (e) { }
  updateBadge();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go({ tab: b.dataset.tab }));

// ---------- Sauvegarde ----------
function refreshSaveBox() { const box = document.getElementById("saveBox"); if (box && document.activeElement !== box) { try { box.value = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); } catch (e) { } } }
document.getElementById("copySave").onclick = () => {
  const box = document.getElementById("saveBox"); refreshSaveBox();
  navigator.clipboard?.writeText(box.value).then(() => toast("Code copié.")).catch(() => { box.select(); toast("Sélectionnez et copiez le code."); });
};
document.getElementById("restoreSave").onclick = () => {
  const box = document.getElementById("saveBox");
  try { const s = JSON.parse(decodeURIComponent(escape(atob(box.value.trim())))); if (!s.cards) throw 0; state = Object.assign({ cards: {}, done: {}, days: {} }, s); save(); go({ tab: "parcours" }); toast("Progression restaurée."); }
  catch (e) { toast("Code illisible."); }
};
let resetArmed = false;
document.getElementById("resetSave").onclick = e => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = "Confirmer la remise à zéro"; setTimeout(() => { resetArmed = false; e.target.textContent = "Tout remettre à zéro"; }, 4000); return; }
  state = { cards: {}, done: {}, days: {} }; save(); resetArmed = false; e.target.textContent = "Tout remettre à zéro"; go({ tab: "parcours" }); toast("Progression effacée.");
};

// ---------- Démarrage ----------
load();
document.getElementById("today").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
refreshSaveBox();
(function boot() {
  const h = (location.hash || "").slice(1);
  if (h === "revisions" || h === "plan") go({ tab: h });
  else if (MODULES.some(m => m.id === h)) go({ tab: "module", id: h });
  else go({ tab: "parcours" });
})();
</script>
