<script>
// ---------- Données ----------
const UES = DATA.ues;
const UE_BY = Object.fromEntries(UES.map(u => [u.code, u]));
const CHAPS = DATA.chapitres;
const CHAP_BY = Object.fromEntries(CHAPS.map(c => [c.id, c]));
const EXO = {};
CHAPS.forEach(c => c.exercices.forEach(e => { EXO[e.id] = e; }));
const PCG = DATA.pcg || [];
const LABEL_RAW = Object.fromEntries(PCG.map(a => [a.num, a.label]));
// Libellé d'un compte : le sien, sinon celui du compte parent le plus précis (28154 → 2815).
const LABEL = new Proxy(LABEL_RAW, { get(t, k) { if (typeof k !== "string") return undefined; for (let n = k; n.length >= 2; n = n.slice(0, -1)) if (t[n]) return t[n]; return ""; } });
const CLASSES = [["1", "Capitaux"], ["2", "Immobilisations"], ["3", "Stocks"], ["4", "Tiers"], ["5", "Financiers"], ["6", "Charges"], ["7", "Produits"]];
const TYPE_LABEL = { qcm: "Question à choix unique", multi: "Plusieurs réponses possibles", calc: "Calcul", tri: "Classement", ecriture: "Écriture au journal" };
// Révisions espacées : uniquement des définitions et de la compréhension, jamais de calcul.
// Trois sources : les cartes de notions (recto/verso, tirées des fiches officielles), les QCM et classements
// de nature « notion » et les comptes du plan comptable (intitulé et rôle). Les calculs et écritures restent dans les chapitres.
const pcgSupprime = a => /^supprim/i.test(a.pcg2025 || "");
const CARTE = {};
CHAPS.forEach(c => (c.cartes || []).forEach(k => { k.chap = c.id; CARTE[k.id] = k; }));
const COMPTE = {};
PCG.forEach(a => { if (!pcgSupprime(a)) COMPTE["pcg-" + a.num] = a; });
const isNotion = e => !!e && e.nature === "notion" && /^(qcm|multi|tri)$/.test(e.type);
const SRS = {}, SRS_ORDER = {};
CHAPS.forEach(c => {
  const ks = (c.cartes || []).map(k => k.id), qs = c.exercices.filter(isNotion).map(e => e.id); const list = SRS_ORDER[c.ue] || (SRS_ORDER[c.ue] = []);
  for (let i = 0; i < Math.max(ks.length, qs.length); i++) { if (ks[i]) list.push(ks[i]); if (qs[i]) list.push(qs[i]); }
  ks.forEach(id => { SRS[id] = { kind: "carte", th: c.ue, chap: c.id }; }); qs.forEach(id => { SRS[id] = { kind: "exo", th: c.ue, chap: c.id }; });
});

const KEY = "debit-credit.v2";

  { j: 0, nom: "Chaque mois", court: "Mois" },

const MAX_STEP = STEPS.length - 1;
const ACQUIS = 3; // une question est « mémorisée » à partir de l'étape 10 jours
const BANDS = [{ nom: "Nouvelles" }, { nom: "À reprendre (demain)" }, { nom: "En apprentissage (2 et 5 jours)" }, { nom: "Mémorisées (10 et 20 jours)" }, { nom: "Ancrées (30 jours et chaque mois)" }];
const bandOf = st => st <= 0 ? 1 : st <= 2 ? 2 : st <= 4 ? 3 : 4;
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

const EMPTY = () => ({ cards: {}, days: {}, xp: 0, daily: {}, read: {}, done: {}, seen: {}, fiches: {}, succes: {}, hist: {}, newIntro: {}, newPerDay: 10, stats: { run: 0, best: 0, revs: 0, src: 0, search: 0, unseen: 0, init: 0 } });

function srcLink(src, url) {
  if (url) return url;
  const q = encodeURIComponent(src);
  if (/BOI-/i.test(src)) return "https://bofip.impots.gouv.fr/";
  if (/\bANC\b|PCG|plan comptable/i.test(src)) return "https://www.anc.gouv.fr/";
  return `https://www.legifrance.gouv.fr/search/all?tab_selection=all&searchField=ALL&query=${q}&page=1&init=true`;
}
function fmtDate(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : esc(iso); }

  const tag = it => /millésimé/.test(it.fiab || "") ? ` <span class="pill year">chiffres ${esc(it.fiab.replace("millésimé ", ""))}</span>` : "";

${(f.sections || []).map(s => `<h3>${esc(s.h)}</h3><ol class="fl">${(s.items || []).map(item).join("")}</ol>`).join("")}</div>`;

function renderTest() {
  const today = todayKey(); const plan = dailyPlan(today);
  const list = plan.ids.map(id => EXO[id]).filter(Boolean);
  if (!list.length) { main.innerHTML = `<h2>Test du jour</h2><p>Aucune question disponible.</p>`; return; }
  const remaining = list.filter(e => !(e.id in plan.answers));
  main.innerHTML = `<h2>Test du jour · ${new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}</h2><p class="muted">${list.length} questions : révisions dues en priorité, puis notions nouvelles des matières les plus fragiles. Le score du jour est enregistré une fois le test terminé.</p><div class="crumb"><span class="progress" id="prog"></span></div><div id="host"></div>`;
  const host = main.querySelector("#host"); const prog = main.querySelector("#prog");
  const finishScreen = () => {
    const score = Object.values(plan.answers).filter(Boolean).length;
    if (!plan.done) { plan.done = true; plan.score = score; addXp(50 + (score === list.length ? 100 : 0)); save(); }
    prog.textContent = "Terminé";
    const byUe = {}; list.forEach(e => { const ue = CHAP_BY[e.chap].ue; byUe[ue] = byUe[ue] || [0, 0]; byUe[ue][1]++; if (plan.answers[e.id]) byUe[ue][0]++; });
    host.innerHTML = `<div class="exo"><h3 style="margin-top:0">${plan.score} / ${list.length}${plan.score === list.length ? " · sans faute" : ""}</h3><p>${Object.entries(byUe).map(([u, [a, b]]) => `${esc(u)} : ${a}/${b}`).join(" · ")}</p><p class="muted small">Les questions de définition et de compréhension ratées reviendront demain dans les révisions espacées ; les calculs se retravaillent dans les chapitres. Revenez demain pour un nouveau test.</p><div class="actions"><button class="btn" id="toA">Retour à l'accueil</button><button class="btn ghost" id="toR">Réviser maintenant</button></div></div>`;
    host.querySelector("#toA").onclick = () => go({ tab: "accueil" }); host.querySelector("#toR").onclick = () => go({ tab: "revisions" });

    const t = q.trim().toLowerCase();
    const rows = PCG.filter(a => (!cls || a.num[0] === cls) && (!onlyNew || a.pcg2025) && (!t || a.num.startsWith(t) || a.label.toLowerCase().includes(t) || (a.explication || "").toLowerCase().includes(t))).slice(0, 400);
    list.innerHTML = rows.length ? rows.map(a => `<button class="acct" data-n="${a.num}" aria-expanded="false"><span class="n">${a.num}</span>${esc(a.label)} ${a.pcg2025 ? `<span class="pill ${pcgSupprime(a) ? "del" : "new"}">${pcgSupprime(a) ? "supprimé 2025" : "PCG 2025"}</span>` : ""}<span class="s">${esc(a.sens)}</span></button>`).join("") : `<div class="muted" style="padding:12px 14px">Aucun compte ne correspond.</div>`;
    list.querySelectorAll(".acct").forEach(b => b.onclick = () => {
      const open = b.getAttribute("aria-expanded") === "true"; const nxt = b.nextElementSibling;
      if (open) { b.setAttribute("aria-expanded", "false"); if (nxt && nxt.classList.contains("acct-body")) nxt.remove(); return; }
      const a = PCG.find(x => x.num === b.dataset.n); state.seen[a.num] = 1; save();
      const d = document.createElement("div"); d.className = "acct-body";
      d.innerHTML = `<p>${esc(a.explication)}</p>${a.exemple ? `<p><b>Exemple.</b> ${esc(a.exemple)}</p>` : ""}${a.entry ? journalHTML(a.entry, "") : ""}${a.piege ? `<p><b>Piège.</b> ${esc(a.piege)}</p>` : ""}${a.pcg2025 ? `<p class="muted"><b>Réforme PCG 2025.</b> ${esc(a.pcg2025)}</p>` : ""}<p class="muted small">Solde habituel : ${esc(a.sens)}${a.obligatoire === false ? " · compte facultatif" : ""}</p>`;
      b.setAttribute("aria-expanded", "true"); b.after(d);
    });
  };
  main.querySelectorAll(".cls").forEach(b => b.onclick = () => { cls = cls === b.dataset.c ? "" : b.dataset.c; main.querySelectorAll(".cls").forEach(x => x.setAttribute("aria-pressed", x.dataset.c === cls ? "true" : "false")); draw(); });
  main.querySelector("#q").addEventListener("input", e => { q = e.target.value; draw(); });
  main.querySelector("#onlyNew").addEventListener("change", e => { onlyNew = e.target.checked; draw(); });
  draw();
}

// ---------- Succès (vue) ----------
let succFilter = "Tous";
function renderSucces() {
  state.stats.unseen = 0; persist(); updateSuccBadge();
  const got = SUCCES.filter(x => state.succes[x.id]);
  const xpS = got.reduce((a, x) => a + TIER_XP[x.tier], 0);
  const byTier = t => got.filter(x => x.tier === t).length;
  const nx = nextSucces(1)[0];
  main.innerHTML = `<h2>Succès</h2><p class="muted">${SUCCES.length} succès en six catégories. Chacun se débloque automatiquement et rapporte de l'XP : 20 pour le bronze, 50 pour l'argent, 100 pour l'or.</p>
<div class="board"><div class="tile"><div class="big">${got.length}<span class="muted" style="font-size:1rem"> / ${SUCCES.length}</span></div><div class="lab">succès débloqués</div></div><div class="tile"><div class="big">${byTier("or")} · ${byTier("argent")} · ${byTier("bronze")}</div><div class="lab">or · argent · bronze</div></div><div class="tile"><div class="big">${fmt(xpS)}</div><div class="lab">XP gagnés grâce aux succès</div></div></div>
${nx ? `<p class="small"><b>Le plus proche :</b> ${esc(nx.nom)}, ${esc(nx.desc.toLowerCase())} (${fmt(Math.min(nx.prog(), nx.target))} / ${fmt(nx.target)}).</p>` : ""}
<div class="chips" role="group" aria-label="Catégories">${["Tous", ...SUCC_CATS].map(c => { const list = c === "Tous" ? SUCCES : SUCCES.filter(x => x.cat === c); return `<button data-c="${c}" aria-pressed="${c === succFilter}">${c} <span class="mono">${list.filter(x => state.succes[x.id]).length}/${list.length}</span></button>`; }).join("")}</div>
<div class="sgrid" id="sg"></div>`;
  const draw = () => {
    const list = succFilter === "Tous" ? SUCCES : SUCCES.filter(x => x.cat === succFilter);
    main.querySelector("#sg").innerHTML = list.map(succCard).join("");
    main.querySelectorAll(".chips button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === succFilter)));
  };
  main.querySelectorAll(".chips button").forEach(b => b.onclick = () => { succFilter = b.dataset.c; draw(); });
  draw();
}

// ---------- Expédition ----------
const ETAPES = [["UE9", "Les fjords"], ["UE10", "La vallée"], ["UE2", "Les plateaux"], ["UE3", "Les glaciers"], ["UE4", "Les volcans"], ["UE6", "Le cap des aurores"]];
function renderExpedition() {
  const r = rank(); const g = globalMastery();
  main.innerHTML = `<h2>L'expédition vers les aurores</h2><p class="muted">Chaque chapitre acquis allume un camp sur la route. Plus vous avancez, plus le ciel s'illumine. Le test du jour entretient la lanterne : une série de jours d'affilée la garde allumée.</p>
<div class="sky"><canvas id="skyC" width="960" height="420" aria-label="Carte de l'expédition"></canvas><div class="legend">Aurore à ${Math.round(g * 100)} % · lanterne ${streak() > 0 ? "allumée depuis " + streak() + " jour" + (streak() > 1 ? "s" : "") : "éteinte"}</div></div>
<div class="board"><div class="tile"><div class="big">${esc(r.name)}</div><div class="lab">${fmt(state.xp)} XP${r.next ? ` · prochain grade « ${esc(r.next[1])} » à ${fmt(r.next[0])} XP` : " · grade maximal"}</div></div><div class="tile"><div class="big">${CHAPS.filter(c => chapMastery(c) >= 0.999).length}<span class="muted" style="font-size:1rem"> / ${CHAPS.length}</span></div><div class="lab">camps allumés</div></div><div class="tile"><div class="big">${Object.keys(state.succes).length}<span class="muted" style="font-size:1rem"> / ${SUCCES.length}</span></div><div class="lab">succès</div></div></div>
<h3>Étapes</h3><div class="ledger">${ETAPES.map(([code, nom], i) => { const u = UE_BY[code]; if (!u) return ""; const m = ueMastery(code); return `<button class="row" data-ue="${code}"><span class="num">${i + 1}</span><span><span class="ttl">${esc(nom)}</span><br><span class="sub">${esc(u.nom)} · ${ueChaps(code).filter(c => chapMastery(c) >= 0.999).length}/${ueChaps(code).length} camps</span></span><span class="right"><div class="bar ${m >= 0.999 ? "full" : ""}"><i style="width:${Math.round(m * 100)}%"></i></div><span class="mono muted small">${Math.round(m * 100)} %</span></span></button>`; }).join("")}</div>
<h3>Derniers succès</h3>${(() => { const last = SUCCES.filter(x => state.succes[x.id]).sort((a, b) => state.succes[b.id] - state.succes[a.id]).slice(0, 4); return last.length ? `<div class="sgrid">${last.map(succCard).join("")}</div>` : `<p class="muted">Aucun succès pour l'instant. Le premier se débloque dès la première réponse.</p>`; })()}
<div class="actions"><button class="btn ghost" id="toSucc">Voir les ${SUCCES.length} succès</button></div>
<p class="muted small" style="margin-top:12px">XP : 10 × niveau par exercice réussi du premier coup (5 × niveau en révision), 30 par chapitre terminé, 50 par test du jour, 100 de plus s'il est sans faute, et 20, 50 ou 100 par succès débloqué selon son palier.</p>`;
  main.querySelector("#toSucc").onclick = () => go({ tab: "succes" });
  main.querySelectorAll(".row").forEach(b => b.onclick = () => go({ tab: "ue", code: b.dataset.ue }));
  drawSky(main.querySelector("#skyC"));
}
let skyAnim = 0;
function drawSky(cv) {
  cancelAnimationFrame(skyAnim);
  const ctx = cv.getContext("2d"); const W = cv.width, H = cv.height; const g = globalMastery(); const lit = streak() > 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const camps = []; let x = 70; const stepX = (W - 140) / Math.max(1, CHAPS.length - 1);
  CHAPS.forEach((c, i) => { const y = H - 70 - Math.sin(i / CHAPS.length * Math.PI) * 140 - (i % 3) * 14; camps.push({ x, y, m: chapMastery(c), started: chapStarted(c), ue: c.ue }); x += stepX; });
  const frame = t => {
    const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#070d1f"); sky.addColorStop(1, "#1a2f56"); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    const rs = mulberry(7); for (let i = 0; i < 120; i++) { const sx = rs() * W, sy = rs() * H * 0.7, a = 0.3 + rs() * 0.7; ctx.fillStyle = `rgba(255,255,255,${a * (0.6 + 0.4 * Math.sin(t / 900 + i))})`; ctx.fillRect(sx, sy, 1.5, 1.5); }
    if (g > 0.01) { const bands = [["57,229,140", 0.0], ["43,212,212", 0.35], ["122,92,255", 0.7]]; bands.forEach(([col, ph], bi) => { for (let k = 0; k < 40; k++) { const bx = k / 40 * W; const wave = Math.sin(bx / 90 + t / 1600 + ph * 6) * 22 + Math.sin(bx / 37 - t / 2300) * 10; const top = 30 + bi * 26 + wave; const h = 60 + 140 * g + Math.sin(bx / 50 + t / 1900) * 20; const gr = ctx.createLinearGradient(0, top, 0, top + h); gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(0.3, `rgba(${col},${0.12 + 0.5 * g})`); gr.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = gr; ctx.fillRect(bx, top, W / 40 + 1, h); } }); }
    ctx.fillStyle = "#0b1326"; ctx.beginPath(); ctx.moveTo(0, H); for (let i = 0; i <= 24; i++) { const mx = i / 24 * W; ctx.lineTo(mx, H - 60 - Math.abs(Math.sin(i * 1.7)) * 120 - Math.abs(Math.cos(i * 0.9)) * 40); } ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = "rgba(223,231,243,0.35)"; ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5; ctx.beginPath(); camps.forEach((c, i) => i ? ctx.lineTo(c.x, c.y) : ctx.moveTo(c.x, c.y)); ctx.stroke(); ctx.setLineDash([]);
    camps.forEach(c => { const on = c.m >= 0.999; const r = on ? 6 : 4; if (on || c.started) { const glow = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, on ? 22 : 12); glow.addColorStop(0, on ? "rgba(255,214,120,0.9)" : "rgba(255,214,120,0.35)"); glow.addColorStop(1, "rgba(255,214,120,0)"); ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(c.x, c.y, on ? 22 : 12, 0, 7); ctx.fill(); } ctx.fillStyle = on ? "#ffd678" : c.started ? "#c9a85a" : "#4b5a73"; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 7); ctx.fill(); });
    const lx = 40, ly = H - 36; ctx.fillStyle = lit ? "#ffd678" : "#3a4559"; ctx.fillRect(lx - 4, ly - 14, 8, 14); if (lit) { const gl = ctx.createRadialGradient(lx, ly - 8, 0, lx, ly - 8, 30 + Math.sin(t / 300) * 3); gl.addColorStop(0, "rgba(255,214,120,0.8)"); gl.addColorStop(1, "rgba(255,214,120,0)"); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(lx, ly - 8, 34, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#dfe7f3"; ctx.font = "500 12px IBM Plex Mono, monospace"; ctx.fillText("Cassegrain", lx + 14, ly - 4); ctx.textAlign = "right"; ctx.fillText("Les aurores", W - 20, 24); ctx.textAlign = "left";
    if (!reduce) skyAnim = requestAnimationFrame(frame);
  };
  frame(0);
}

// ---------- Navigation ----------
// Cinq rubriques ; certaines regroupent deux pages, reliées par une sous-navigation.
const GROUP = { accueil: "accueil", revisions: "revisions", test: "revisions", matieres: "matieres", fiches: "matieres", ue: "matieres", chap: "matieres", pcg: "pcg", expedition: "expedition", succes: "expedition" };
const SUBNAV = { revisions: [["revisions", "Révisions espacées"], ["test", "Test du jour"]], matieres: [["matieres", "Matières"], ["fiches", "Fiches documentaires"]], expedition: [["expedition", "Expédition"], ["succes", "Succès"]] };
function addSubnav(tab) {
  const items = SUBNAV[GROUP[tab]]; if (!items || !items.some(x => x[0] === tab)) return;
  const d = document.createElement("div"); d.className = "subnav";
  d.innerHTML = `<span class="seg" role="group" aria-label="Sous-rubriques">${items.map(([t, l]) => `<button data-sub="${t}" aria-pressed="${t === tab}">${l}</button>`).join("")}</span>`;
  d.querySelectorAll("button").forEach(b => b.onclick = () => go({ tab: b.dataset.sub }));
  main.prepend(d);
}
function go(v) {
  cancelAnimationFrame(skyAnim);
  view = v;
  const tab = GROUP[v.tab] || v.tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  ({ accueil: renderAccueil, matieres: renderMatieres, fiches: renderFiches, ue: () => renderUe(v.code), chap: () => renderChap(v.id, v.start), test: renderTest, revisions: renderRevisions, pcg: renderPcg, expedition: renderExpedition, succes: renderSucces })[v.tab]();
  addSubnav(v.tab);
  try { history.replaceState(null, "", "#" + (v.tab === "ue" ? "m" + v.code.toLowerCase() : v.tab === "chap" ? v.id : v.tab)); } catch (e) { }
  updateBadge(); renderRank(); window.scrollTo({ top: 0 });
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go({ tab: b.dataset.tab }));
document.getElementById("brand").onclick = () => go({ tab: "accueil" });

// ---------- Sauvegarde ----------
function refreshSaveBox() { const box = document.getElementById("saveBox"); if (box && document.activeElement !== box) { try { box.value = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); } catch (e) { } } }
document.getElementById("copySave").onclick = () => { const box = document.getElementById("saveBox"); refreshSaveBox(); (navigator.clipboard ? navigator.clipboard.writeText(box.value) : Promise.reject()).then(() => toast("Code copié.")).catch(() => { box.select(); toast("Sélectionnez et copiez le code."); }); };
document.getElementById("restoreSave").onclick = () => { const box = document.getElementById("saveBox"); try { const s = JSON.parse(decodeURIComponent(escape(atob(box.value.trim())))); if (!s.cards) throw 0; state = normalize(s); save(); go({ tab: "accueil" }); toast("Progression restaurée."); } catch (e) { toast("Code illisible."); } };
let resetArmed = false;
document.getElementById("resetSave").onclick = e => { if (!resetArmed) { resetArmed = true; e.target.textContent = "Confirmer la remise à zéro"; setTimeout(() => { resetArmed = false; e.target.textContent = "Tout remettre à zéro"; }, 4000); return; } state = EMPTY(); save(); resetArmed = false; e.target.textContent = "Tout remettre à zéro"; go({ tab: "accueil" }); toast("Progression effacée."); };

// ---------- Démarrage ----------
load();
document.getElementById("buildInfo").textContent = `Version du ${DATA.build.date} · ${CHAPS.length} chapitres · ${Object.keys(EXO).length} exercices · ${Object.keys(CARTE).length} cartes de notions · ${PCG.length} comptes. Ce fichier fonctionne hors ligne : enregistrez-le et ouvrez-le avec un navigateur.`;
refreshSaveBox();
if (!state.stats.init) { checkSucces(true); state.stats.init = 1; persist(); }
updateSuccBadge();
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest(".fsrc a, .fiche table a, .fiche .small a"); if (a) { state.stats.src++; save(); } });
(function boot() {
  const h = (location.hash || "").slice(1);
  if (["matieres", "fiches", "test", "revisions", "pcg", "expedition", "succes"].includes(h)) go({ tab: h });
  else if (/^mue\d+$/.test(h) && UE_BY[h.slice(1).toUpperCase()]) go({ tab: "ue", code: h.slice(1).toUpperCase() });
  else if (CHAP_BY[h]) go({ tab: "chap", id: h });
  else go({ tab: "accueil" });
})();
</script>
