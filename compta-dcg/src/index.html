/* Layout : une appli de révision. En-tête collant avec cinq rubriques (barre du bas sur téléphone), une carte « séance du jour »
   en tête d'accueil, et une couleur par matière (UE9, UE10, UE2, UE3, UE4, UE6, plan comptable) toujours accompagnée de son code. */
:root {
  --paper: #f3f5f9; --card: #ffffff; --ink: #161f2e; --muted: #5a6476;
  --rule: #dde2eb; --rule-soft: #ecf0f5; --margin: #d93b3b;
  --accent: #2456d6; --accent-soft: #e7edfc; --accent-ink: #ffffff;

  --bronze: #9a5b2e; --silver: #5f6b78; --gold: #9a7410;
  --st1: #86b6ef; --st1-ink: #0b0b0b; --st2: #3987e5; --st2-ink: #0b0b0b; --st3: #1c5cab; --st3-ink: #ffffff; --st4: #0d366b; --st4-ink: #ffffff; --viz1: #2a78d6;
  --sky1: #0b1630; --sky2: #16305a; --aurora1: #39e58c; --aurora2: #7a5cff; --aurora3: #2bd4d4;
  /* Bandes du spectre électromagnétique : UE9 visible, UE10 ultraviolet, UE2 radio, UE3 infrarouge, UE4 rayons X, UE6 rayons gamma,
     plan comptable micro-ondes (le fond diffus cosmologique). Ordre des matières validé pour le daltonisme ; --o-* = texte posé sur la couleur. */
  --c-UE9: #1f7a3a; --c-UE10: #2196d6; --c-UE2: #a8231b; --c-UE3: #d6a200; --c-UE4: #4434c2; --c-UE6: #c63aa9; --c-PCG: #e35d1a;
  --o-UE9: #ffffff; --o-UE10: #ffffff; --o-UE2: #ffffff; --o-UE3: #1c1500; --o-UE4: #ffffff; --o-UE6: #ffffff; --o-PCG: #1c0d00;
  --night1: #050816; --night2: #101a3c; --night-ink: #eef2ff; --night-muted: #aab5d6; --night-line: rgba(170, 181, 214, 0.22);
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 6px 18px rgba(16, 24, 40, 0.06);
  --bar-bg: rgba(255, 255, 255, 0.92);
  --display: "Sora", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.25); --bar-bg: rgba(22, 29, 40, 0.94);

}

  --c-UE9: #2b9149; --c-UE10: #3b8fe0; --c-UE2: #c7372f; --c-UE3: #b58f12; --c-UE4: #6f5ee8; --c-UE6: #c74fb4; --c-PCG: #dc7426;
  --o-UE9: #ffffff; --o-UE10: #0b1020; --o-UE2: #ffffff; --o-UE3: #1c1500; --o-UE4: #ffffff; --o-UE6: #ffffff; --o-PCG: #1c0d00;

* { box-sizing: border-box; }

.reticle::after { content: ""; position: absolute; inset: 0; background: linear-gradient(var(--ink), var(--ink)) center / 2px 100% no-repeat, linear-gradient(var(--ink), var(--ink)) center / 100% 2px no-repeat; -webkit-mask: radial-gradient(circle, transparent 2.5px, #000 3px, #000 8px, transparent 8.5px); mask: radial-gradient(circle, transparent 2.5px, #000 3px, #000 8px, transparent 8.5px); }
.brand .dscg { background: linear-gradient(90deg, var(--c-UE2), var(--c-PCG) 22%, var(--c-UE3) 38%, var(--c-UE9) 55%, var(--c-UE10) 70%, var(--c-UE4) 85%, var(--c-UE6)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { display: none; }

}

// ---------- Rendu d'un exercice ----------
function renderExercise(ex, host, onDone, meta) {

    order.forEach((oi, k) => {
      const b = document.createElement("button"); b.className = "opt"; b.type = "button"; b.dataset.i = oi; b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<span class="k">${multi ? "☐" : "ABCDEF"[k]}</span><span>${esc(ex.opts[oi])}</span>`;
      b.onclick = () => { if (finished) return; if (multi) { if (chosen.has(oi)) chosen.delete(oi); else chosen.add(oi); b.setAttribute("aria-pressed", chosen.has(oi) ? "true" : "false"); b.querySelector(".k").textContent = chosen.has(oi) ? "☑" : "☐"; } else { chosen = new Set([oi]); wrap.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", o === b ? "true" : "false")); } };

    const inp = body.querySelector("input");

    const tol = ex.tol ?? 0.5;

<div class="jwrap"><table class="journal"><thead><tr><th>Compte</th><th>Intitulé</th><th style="text-align:right">Débit</th><th style="text-align:right">Crédit</th><th></th></tr></thead><tbody></tbody><tfoot><tr class="total"><td></td><td class="lib">Totaux</td><td class="amt" id="td-${ex.id}">0</td><td class="amt" id="tc-${ex.id}">0</td><td></td></tr></tfoot></table></div>
<div class="balance" id="bal-${ex.id}">Débit et crédit doivent être égaux.</div><div class="actions"><button class="btn quiet" type="button" id="add-${ex.id}">+ Ajouter une ligne</button></div>`;

    body.querySelector(`#add-${ex.id}`).onclick = addLine; addLine(); addLine();
    const key = l => `${l.a}|${l.d > 0 ? "D" : "C"}|${Math.round((l.d || l.c) * 100)}`;
    const matches = (lines, sol) => { if (lines.length !== sol.length) return false; const pool = sol.map(key); for (const l of lines) { const i = pool.indexOf(key(l)); if (i < 0) return false; pool.splice(i, 1); } return true; };

// ---------- Carte recto/verso (auto-évaluée, comme dans Anki) ----------
function itemObj(id) { return EXO[id] || CARTE[id] || (COMPTE[id] ? { id } : null); }
function itemLabel(o) { const it = SRS[o.id]; if (it && it.kind === "compte") return `Plan comptable · classe ${o.id[4]}`; const ch = CHAP_BY[(EXO[o.id] || CARTE[o.id] || {}).chap]; return ch ? `${ch.ue} · ${ch.title}` : ""; }
function renderItem(o, host, onDone, meta) {
  const th = (SRS[o.id] || {}).th || (CHAP_BY[o.chap] || {}).ue; if (th) { host.style.setProperty("--c", `var(--c-${th})`); host.style.setProperty("--o", `var(--o-${th})`); }

}
function renderFlash(o, host, onDone, meta) {
  host.innerHTML = "";

  const box = document.createElement("div"); box.className = "exo flash";
  box.innerHTML = `<div class="meta"><span class="eyebrow">${esc(meta || "")}</span><span class="progress">${tag}</span></div><div class="q">${esc(q)}</div><div class="verso" hidden>${verso}</div><div class="fb"></div><div class="actions"></div><p class="small muted keys">Répondez de tête, puis retournez la carte et dites franchement si vous saviez.<span class="kb"> Clavier : Espace pour retourner, 1 « Je ne savais pas », 2 « Je savais ».</span></p>`;
  host.appendChild(box);
  const act = box.querySelector(".actions"), fb = box.querySelector(".fb"), versoEl = box.querySelector(".verso");
  const mk = (txt, cls) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn " + (cls || ""); b.textContent = txt; return b; };
  const flip = mk("Retourner la carte"), ko = mk("Je ne savais pas", "quiet"), ok = mk("Je savais"), next = mk("Suivant");
  ko.hidden = ok.hidden = next.hidden = true; act.append(flip, ko, ok, next);
  let state0 = "recto";
  const show = () => { if (state0 !== "recto") return; state0 = "verso"; versoEl.hidden = false; flip.hidden = true; ko.hidden = ok.hidden = false; ok.focus(); };
  const grade = good => { if (state0 !== "verso") return; state0 = "fini"; ko.hidden = ok.hidden = true; next.hidden = false; fb.innerHTML = `<div class="feedback ${good ? "ok" : "bad"}"><p><b>${good ? "Vous saviez." : "À revoir."}</b></p></div>`; onDone(good); next.focus(); };
  flip.onclick = show; ok.onclick = () => grade(true); ko.onclick = () => grade(false);
  next.onclick = () => host.dispatchEvent(new CustomEvent("next", { bubbles: true }));
  const onKey = e => {
    if (!box.isConnected) { document.removeEventListener("keydown", onKey); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (state0 === "recto" && (e.key === " " || e.key === "Enter") && e.target.tagName !== "BUTTON") { e.preventDefault(); show(); }
    else if (state0 === "verso" && (e.key === "1" || e.key === "2")) { e.preventDefault(); grade(e.key === "2"); }
  };
  document.addEventListener("keydown", onKey);
  setTimeout(() => flip.focus(), 30);
}

// Déroule une liste d'exercices dans host ; onEach(ex, ok) ; onEnd(score)
function runSeries(host, list, labelFn, onEach, onEnd, progressEl) {
  let i = 0, score = 0;
  const step = () => {
    if (i >= list.length) { onEnd(score); return; }
    if (progressEl) progressEl.textContent = `${i + 1} / ${list.length}`;
    renderItem(list[i], host, ok => { onEach(list[i], ok); if (ok) score++; }, labelFn(list[i]));
  };
  host.addEventListener("next", () => { i++; step(); window.scrollTo({ top: Math.max(0, host.getBoundingClientRect().top + window.scrollY - 80) }); });
  step();
  return { redo: () => { i = 0; score = 0; step(); } };
}

<script>
// ---------- Test du jour ----------
function dailyPlan(dateKey) {
  if (state.daily[dateKey] && state.daily[dateKey].ids) return state.daily[dateKey];
  const rng = mulberry(hashStr(dateKey + "|dc"));
  const N = 20;
  const chosen = [];
  const due = shuffle(dueList().filter(id => EXO[id]), rng).slice(0, 10);
  chosen.push(...due);
  const started = CHAPS.filter(chapStarted);
  const pool = (started.length ? started : CHAPS.slice(0, 3));
  const weak = pool.slice().sort((a, b) => ueMastery(a.ue) - ueMastery(b.ue) || rng() - 0.5);
  const fresh = [];
  for (const ch of weak) for (const e of shuffle(ch.exercices, rng)) if (card(e.id).n === 0 && !chosen.includes(e.id)) fresh.push(e.id);
  // garantir ≥ 60 % de questions à choix
  const isQ = id => /^(qcm|multi)$/.test(EXO[id].type);
  for (const id of fresh) { if (chosen.length >= N) break; chosen.push(id); }
  if (chosen.length < N) for (const ch of CHAPS) for (const e of ch.exercices) { if (chosen.length >= N) break; if (!chosen.includes(e.id)) chosen.push(e.id); }
  let q = chosen.filter(isQ).length;
  if (q < Math.ceil(N * 0.6)) {
    const extraQ = Object.keys(EXO).filter(id => isQ(id) && !chosen.includes(id)).sort(() => rng() - 0.5);
    for (let i = chosen.length - 1; i >= 0 && q < Math.ceil(N * 0.6) && extraQ.length; i--) if (!isQ(chosen[i])) { chosen[i] = extraQ.pop(); q++; }
  }
  const plan = { ids: shuffle(chosen.slice(0, N), rng), answers: {}, done: false, score: 0 };
  state.daily[dateKey] = plan; save();
  return plan;
}
function dailyHistory(days) { const out = []; const d = new Date(); for (let i = days - 1; i >= 0; i--) { const x = new Date(d); x.setDate(d.getDate() - i); const k = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; const p = state.daily[k]; out.push({ k, p: p && p.done ? p.score / p.ids.length : null }); } return out; }

// ---------- Succès ----------
const TIER_XP = { bronze: 20, argent: 50, or: 100 };

function okBy(types) { let n = 0; for (const id in state.cards) { const e = EXO[id]; if (e && types.includes(e.type)) n += state.cards[id].ok || 0; } return n; }
function okIn(ids) { let n = 0; for (const id of ids) n += (state.cards[id] && state.cards[id].ok) || 0; return n; }
function totalOk() { let n = 0; for (const id in state.cards) n += state.cards[id].ok || 0; return n; }
function answered() { let n = 0; for (const id in state.cards) n += state.cards[id].n || 0; return n; }
const testsDone = () => Object.values(state.daily).filter(p => p.done).length;

const uesStarted = () => UES.filter(u => ueChaps(u.code).some(c => chapMastery(c) >= 0.999)).length;

const bestDay = () => Math.max(0, ...Object.values(state.days));
// Un samedi et le dimanche qui suit, tous deux travaillés.
const weekends = () => Object.keys(state.days).filter(k => { const d = new Date(k + "T12:00:00"); if (d.getDay() !== 6) return false; d.setDate(d.getDate() + 1); return !!state.days[`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`]; }).length;
const ueNotionsPct = code => { const ids = SRS_IDS.filter(id => SRS[id].th === code); return ids.length ? Math.floor(memorized(ids) / ids.length * 100) : 0; };
const S = (id, cat, tier, ic, nom, desc, prog, target) => ({ id, cat, tier, ic, nom, desc, prog, target });
const UE_SUCC = { UE9: ["📒", "Maître des comptes"], UE10: ["🏛", "Expert en évaluation"], UE2: ["⚖", "Juriste d'affaires"], UE3: ["🤝", "Spécialiste du droit social"], UE4: ["🧾", "Fiscaliste"], UE6: ["📈", "Directeur financier"] };

const SUCC_BY = Object.fromEntries(SUCCES.map(x => [x.id, x]));
const succQueue = [];
function checkSucces(silent) {
  const fresh = [];
  for (let guard = 0; guard < 6; guard++) {
    const now = SUCCES.filter(x => !state.succes[x.id] && x.prog() >= x.target);
    if (!now.length) break;
    for (const x of now) { state.succes[x.id] = Date.now(); state.xp = (state.xp || 0) + TIER_XP[x.tier]; fresh.push(x); }
  }
  if (!fresh.length) return;
  if (!silent) { state.stats.unseen += fresh.length; succQueue.push(...fresh); showNextSucc(); }
  persist(); updateSuccBadge(); renderRank();
}
function showNextSucc() {
  const p = document.getElementById("succPop");
  if (showNextSucc.busy || !succQueue.length || !p) return;
  const x = succQueue.shift(); showNextSucc.busy = true;
  p.innerHTML = `<span class="ic">${x.ic}</span><span><span class="k">Succès débloqué · ${x.tier}</span><br><b>${esc(x.nom)}</b> <span class="mono small" style="color:var(--ok)">+${TIER_XP[x.tier]} XP</span><br><span class="small muted">${esc(x.desc)}</span></span>`;
  p.classList.add("show");
  setTimeout(() => { p.classList.remove("show"); setTimeout(() => { showNextSucc.busy = false; showNextSucc(); }, 350); }, 3400);
}
function updateSuccBadge() { const b = document.getElementById("succBadge"); if (!b) return; const u = state.stats.unseen || 0; b.textContent = u ? "+" + u : "0"; b.classList.toggle("zero", !u); }
function succCard(x) {
  const got = state.succes[x.id]; const cur = Math.min(x.prog(), x.target); const pct = Math.round(cur / x.target * 100);
  return `<div class="succ ${got ? "unlocked" : "locked"} ${x.tier}"><span class="ic" aria-hidden="true">${x.ic}</span><b>${esc(x.nom)}</b><span class="d">${esc(x.desc)}</span><span class="meta"><span class="tier ${x.tier}">${x.tier}</span>${got ? `obtenu le ${new Date(got).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}` : `${fmt(cur)} / ${fmt(x.target)}`}<span>+${TIER_XP[x.tier]} XP</span></span>${got ? "" : `<div class="bar"><i style="width:${pct}%"></i></div>`}</div>`;
}
function nextSucces(n) { return SUCCES.filter(x => !state.succes[x.id]).map(x => ({ x, r: Math.min(1, x.prog() / x.target) })).sort((a, b) => b.r - a.r || TIER_XP[a.x.tier] - TIER_XP[b.x.tier]).slice(0, n).map(o => o.x); }

const NPD_CHOIX = [0, 5, 10, 15, 20, 25, 30, 40, 50, 60];
const MARGE = 14; // derniers jours sans nouvelles notions : consolidation avant l'examen
function planTravail() {
  if (!state.exam) return null;
  const ex = new Date(state.exam + "T12:00:00"); if (isNaN(ex)) return null;
  const jours = Math.ceil((startOfDay(ex) - startOfDay(Date.now())) / DAY);
  const restantes = newPool("Tous").length; const utiles = Math.max(1, jours - MARGE);
  const conseil = jours > 0 ? Math.ceil(restantes / utiles) : 0;
  const chapRest = CHAPS.filter(c => chapMastery(c) < 0.999).length; const parSem = jours > 0 ? Math.ceil(chapRest / Math.max(1, utiles / 7)) : 0;
  const rythme = state.newPerDay || 0; const fin = rythme > 0 ? new Date(startOfDay(Date.now()) + Math.ceil(restantes / rythme) * DAY) : null;
  const limite = new Date(startOfDay(ex) - MARGE * DAY);
  return { ex, jours, restantes, conseil, chapRest, parSem, rythme, fin, limite, aTemps: !!fin && fin <= limite };
}
function planHTML() {
  const P = planTravail();
  if (!P) return `<section class="plan-card" aria-labelledby="pTitle"><div class="hd"><h3 id="pTitle" style="margin:0">Plan de travail</h3></div><p class="muted" style="margin:0">Indiquez la date de votre examen : l'outil calcule combien de nouvelles notions apprendre chaque jour et combien de chapitres boucler par semaine pour tout voir à temps, avec deux semaines de consolidation à la fin.</p><form id="examForm"><label for="examDate" class="small muted">Date de l'examen</label><input type="date" id="examDate" required><button class="btn" type="submit">Enregistrer</button></form></section>`;
  const dt = d => d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }).replace(/^1 /, "1er ");

// ---------- Calendrier d'activité (heatmap) ----------
const HEAT_SEUILS = [1, 10, 30, 60]; // réponses par jour : 1-9, 10-29, 30-59, 60 et plus
function heatHTML(semaines) {
  const kOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const today = new Date(); today.setHours(12, 0, 0, 0); const dow = (today.getDay() + 6) % 7; // lundi = 0
  const start = new Date(today); start.setDate(today.getDate() - dow - (semaines - 1) * 7);
  const C = 13, G = 3, L = 28, T = 18; const W = L + semaines * (C + G), H = T + 7 * (C + G);
  const items = []; let cells = ""; let mois = ""; let lastM = -1; let jours = 0, total = 0;
  for (let w = 0; w < semaines; w++) for (let d = 0; d < 7; d++) {
    const x = new Date(start); x.setDate(start.getDate() + w * 7 + d); if (x > today) continue;
    const n = state.days[kOf(x)] || 0; if (n) { jours++; total += n; }
    const b = n >= HEAT_SEUILS[3] ? 4 : n >= HEAT_SEUILS[2] ? 3 : n >= HEAT_SEUILS[1] ? 2 : n >= HEAT_SEUILS[0] ? 1 : 0;
    const i = items.length; items.push({ v: n ? `${n} réponse${n > 1 ? "s" : ""}` : "aucune réponse", l: x.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) });
    cells += `<rect class="cellh h${b}${x.getTime() === today.getTime() ? " today" : ""}" data-i="${i}" tabindex="-1" x="${L + w * (C + G)}" y="${T + d * (C + G)}" width="${C}" height="${C}" rx="3"><title>${items[i].l} : ${items[i].v}</title></rect>`;
    if (d === 0 && x.getMonth() !== lastM) { lastM = x.getMonth(); mois += `<text x="${L + w * (C + G)}" y="11">${x.toLocaleDateString("fr-FR", { month: "short" })}</text>`; }
  }
  const lab = ["lun.", "", "mer.", "", "ven.", "", ""].map((t, d) => t ? `<text x="0" y="${T + d * (C + G) + 10}">${t}</text>` : "").join("");
  heatHTML.items = items;
  return { html: `<div class="heat chart" id="heatBox"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calendrier d'activité : ${jours} jours travaillés sur les ${semaines} dernières semaines">${mois}${lab}${cells}</svg><div class="tip"></div></div>
<div class="heat-sum"><span><b>${jours}</b> jour${jours > 1 ? "s" : ""} travaillé${jours > 1 ? "s" : ""} sur ${semaines} semaines</span><span><b>${fmt(total)}</b> réponses</span><span>série actuelle : <b>${streak()}</b> j</span><span class="legend" style="margin:0">moins <i style="background:var(--rule-soft)"></i><i style="background:var(--st1)"></i><i style="background:var(--st2)"></i><i style="background:var(--st3)"></i><i style="background:var(--st4)"></i> plus (1, 10, 30, 60 réponses)</span></div>`, items };
}

function lineSVG(data) {

function startSession(th, opts) {
  // Une séance lancée depuis un chapitre peut introduire jusqu'à 30 nouvelles notions de ce chapitre.
  const chapSess = !!CHAP_BY[th];
  const due = dueFor(th); const fresh = newPool(th).slice(0, chapSess ? Math.max(newLeftToday(), 30) : newLeftToday());
  const queue = [...due.slice(0, 60), ...fresh].map(itemObj).filter(Boolean);
  if (!queue.length) { renderRevisions(); return; }
  const moves = { up: 0, down: 0, stay: 0, nouv: 0 };
  const fromHome = !!(opts && opts.chain);
  const back = () => chapSess ? go({ tab: "chap", id: th, start: "cartes" }) : fromHome ? go({ tab: "accueil" }) : renderRevisions();
  main.innerHTML = `<div class="crumb"><button id="back">← ${chapSess ? "Notions du chapitre" : fromHome ? "Accueil" : "Tableau des révisions"}</button><span class="progress" id="prog"></span></div><h2>Séance de révision</h2><p class="muted small">${due.length} notion${due.length > 1 ? "s" : ""} due${due.length > 1 ? "s" : ""}${due.length > 60 ? " (60 premières dans cette séance)" : ""} et ${fresh.length} nouvelle${fresh.length > 1 ? "s" : ""}. ${esc(thNom(th))}.</p><div id="host"></div>`;
  main.querySelector("#back").onclick = back;
  const host = main.querySelector("#host");
  runSeries(host, queue, itemLabel, (ex, ok) => {
    const mv = record(ex.id, ok, "revision");
    if (mv.isNew) { const k = todayKey(); state.newIntro[k] = (state.newIntro[k] || 0) + 1; moves.nouv++; save(); }
    else if (mv.to > mv.from) moves.up++; else if (mv.to < mv.from) moves.down++; else moves.stay++;
    moveNote(host, mv);
  }, score => {
    state.stats.sessions++; if (queue.length >= 10 && score === queue.length) state.stats.perfect++; save();
    main.querySelector("#prog").textContent = "Terminé";
    host.innerHTML = `<div class="exo"><h3 style="margin-top:0">Séance terminée : ${score} sur ${queue.length} du premier coup</h3><p>${moves.up} notion${moves.up > 1 ? "s ont" : " a"} monté d'une marche, ${moves.down} ${moves.down > 1 ? "sont redescendues" : "est redescendue"}, ${moves.nouv} nouvelle${moves.nouv > 1 ? "s" : ""} ${moves.nouv > 1 ? "sont entrées" : "est entrée"} sur l'échelle.</p>${plateauHTML(SRS_IDS.filter(id => inTheme(id, th)))}<div class="actions">${opts && opts.chain && !seance().testDone ? `<button class="btn big" id="toT">Continuer : test du jour</button>` : ""}<button class="btn ${opts && opts.chain && !seance().testDone ? "ghost" : ""}" id="toR">${chapSess ? "Revenir aux notions du chapitre" : "Voir le tableau des révisions"}</button><button class="btn quiet" id="toA">Retour à l'accueil</button></div></div>`;
    host.querySelector("#toR").onclick = chapSess ? back : () => go({ tab: "revisions" }); host.querySelector("#toA").onclick = () => go({ tab: "accueil" });
    const tt = host.querySelector("#toT"); if (tt) tt.onclick = () => go({ tab: "test" });
  }, main.querySelector("#prog"));
}

  const css = getComputedStyle(document.documentElement); const col = code => css.getPropertyValue(`--c-${code}`).trim() || "#7da2ff";
  const rs = mulberry(42);
  const stars = Array.from({ length: 260 }, () => { const band = rs() < 0.45; const tt = rs(); const x = band ? tt * W : rs() * W; const y = band ? H * 0.82 - tt * H * 0.6 + (rs() - 0.5) * 120 : rs() * H; return { x, y, r: rs() < 0.08 ? 1.6 : 0.5 + rs() * 0.9, a: 0.35 + rs() * 0.65, ph: rs() * 6.28 }; });
  const bg = document.createElement("canvas"); bg.width = W * dpr; bg.height = H * dpr; const b = bg.getContext("2d"); b.scale(dpr, dpr);
  const gr = b.createLinearGradient(0, 0, W, H); gr.addColorStop(0, "#0b1430"); gr.addColorStop(1, "#04060f"); b.fillStyle = gr; b.fillRect(0, 0, W, H);
  for (let k = 0; k < 90; k++) { const tt = rs(); const x = tt * W, y = H * 0.82 - tt * H * 0.6 + (rs() - 0.5) * 90; const g = b.createRadialGradient(x, y, 0, x, y, 40 + rs() * 70); g.addColorStop(0, `rgba(170,180,230,${0.035 + rs() * 0.04})`); g.addColorStop(1, "rgba(170,180,230,0)"); b.fillStyle = g; b.beginPath(); b.arc(x, y, 110, 0, 7); b.fill(); }
  const groups = UES.map((u, gi) => { const t = (gi + 0.5) / UES.length; return narrow ? { code: u.code, cx: W * (gi % 2 ? 0.7 : 0.3), cy: H * (0.88 - t * 0.78) } : { code: u.code, cx: 80 + t * (W - 160), cy: H * 0.8 - t * H * 0.58 + (gi % 2 ? 46 : -34) * K }; });
  const objs = [];
  groups.forEach(g => { const cs = ueChaps(g.code); cs.forEach((c, k) => { const ang = -Math.PI / 2 + k / cs.length * Math.PI * 2 + (g.code.length % 7); const rad = (narrow ? 34 : 46 + (k % 2) * 22) * (narrow ? 1 : K); objs.push({ c, t: CIBLE[c.id], x: g.cx + Math.cos(ang) * rad * (narrow ? 1.5 : 1.25), y: g.cy + Math.sin(ang) * rad * (narrow ? 0.95 : 0.85), col: col(g.code), m: chapMastery(c), st: chapStarted(c), code: g.code }); }); });
  const nc = nextChapter();
  const shape = (o, alpha) => {
    const { x, y } = o; ctx.save(); ctx.globalAlpha = alpha; const c = o.col; const ty = o.t ? o.t.type : "neb";
    if (ty === "gal") { ctx.translate(x, y); ctx.rotate(((x * 7) % 3) - 1.2); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 16); g.addColorStop(0, "#ffffff"); g.addColorStop(0.25, c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.scale(1, 0.42); ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill(); }
    else if (ty === "pla") { ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.stroke(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 7); ctx.fill(); }
    else if (ty === "glo") { const g = ctx.createRadialGradient(x, y, 0, x, y, 11); g.addColorStop(0, "#fff"); g.addColorStop(0.35, c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill(); }
    else if (ty === "ouv" || ty === "nua") { const r2 = mulberry(Math.round(x * 13 + y)); ctx.fillStyle = c; for (let k = 0; k < (ty === "nua" ? 22 : 9); k++) { ctx.beginPath(); ctx.arc(x + (r2() - 0.5) * 22, y + (r2() - 0.5) * 18, 1 + r2() * 1.4, 0, 7); ctx.fill(); } ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
    else { for (let k = 0; k < 3; k++) { const ox = [0, 6, -5][k], oy = [0, -4, 5][k]; const g = ctx.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, 13); g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + ox, y + oy, 13, 0, 7); ctx.fill(); } }
    ctx.restore();
  };
  const frame = t => {
    ctx.drawImage(bg, 0, 0);
    stars.forEach(s => { ctx.fillStyle = `rgba(235,240,255,${s.a * (reduce ? 1 : 0.7 + 0.3 * Math.sin(t / 700 + s.ph))})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); });
    groups.forEach(g => { const os = objs.filter(o => o.code === g.code); ctx.strokeStyle = "rgba(170,181,214,0.16)"; ctx.setLineDash([3, 5]); ctx.lineWidth = 1; ctx.beginPath(); os.forEach((o, k) => k ? ctx.lineTo(o.x, o.y) : ctx.moveTo(o.x, o.y)); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = "rgba(220,228,255,0.75)"; ctx.font = "600 13px Sora, Segoe UI, sans-serif"; ctx.textAlign = "center"; ctx.fillText(`${g.code} · ${BANDES[g.code][0]}`, g.cx, g.cy - (narrow ? 50 : 96 * K)); });
    objs.forEach(o => { const seen = o.m >= 0.999; if (seen) shape(o, 1); else if (o.st) shape(o, 0.35); else { ctx.strokeStyle = "rgba(170,181,214,0.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, 7); ctx.stroke(); }
      if (seen || o.st) { ctx.fillStyle = seen ? "rgba(238,242,255,0.95)" : "rgba(170,181,214,0.7)"; ctx.font = "500 11px IBM Plex Mono, monospace"; ctx.textAlign = "center"; ctx.fillText(o.t ? o.t.des : "", o.x, o.y + 26); } });
    const tgt = nc && objs.find(o => o.c.id === nc.id);
    if (tgt) { const rr = 17 + (reduce ? 0 : Math.sin(t / 400) * 2); ctx.strokeStyle = "#eef2ff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(tgt.x, tgt.y, rr, 0, 7); ctx.stroke(); [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.moveTo(tgt.x + dx * (rr - 6), tgt.y + dy * (rr - 6)); ctx.lineTo(tgt.x + dx * (rr + 7), tgt.y + dy * (rr + 7)); ctx.stroke(); }); ctx.fillStyle = "#eef2ff"; ctx.font = "600 12px IBM Plex Mono, monospace"; ctx.textAlign = "center"; ctx.fillText(tgt.t ? tgt.t.des : "", tgt.x, tgt.y - rr - 10); }
    ctx.textAlign = "left";
    if (!reduce) skyAnim = requestAnimationFrame(frame);
  };
  frame(0);
}

// ---------- Navigation ----------
// Cinq rubriques ; certaines regroupent deux pages, reliées par une sous-navigation.
const GROUP = { accueil: "accueil", revisions: "revisions", test: "revisions", matieres: "matieres", fiches: "matieres", ue: "matieres", chap: "matieres", pcg: "pcg", observatoire: "observatoire", succes: "observatoire" };
const SUBNAV = { revisions: [["revisions", "Révisions espacées"], ["test", "Test du jour"]], matieres: [["matieres", "Matières"], ["fiches", "Fiches documentaires"]], observatoire: [["observatoire", "Observatoire"], ["succes", "Succès"]] };
function addSubnav(tab) {
  const items = SUBNAV[GROUP[tab]]; if (!items || !items.some(x => x[0] === tab)) return;
  const d = document.createElement("div"); d.className = "subnav";
  d.innerHTML = `<span class="seg" role="group" aria-label="Sous-rubriques">${items.map(([t, l]) => `<button data-sub="${t}" aria-pressed="${t === tab}">${l}</button>`).join("")}</span>`;
  d.querySelectorAll("button").forEach(b => b.onclick = () => go({ tab: b.dataset.sub }));
  main.prepend(d);
}
function go(v) {
  cancelAnimationFrame(skyAnim);
  view = v;
  const tab = GROUP[v.tab] || v.tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  ({ accueil: renderAccueil, matieres: renderMatieres, fiches: renderFiches, ue: () => renderUe(v.code), chap: () => renderChap(v.id, v.start), test: renderTest, revisions: renderRevisions, pcg: renderPcg, observatoire: renderObservatoire, expedition: renderObservatoire, succes: renderSucces })[v.tab]();
  addSubnav(v.tab);
  try { history.replaceState(null, "", "#" + (v.tab === "ue" ? "m" + v.code.toLowerCase() : v.tab === "chap" ? v.id : v.tab)); } catch (e) { }
  updateBadge(); renderRank(); window.scrollTo({ top: 0 });
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go({ tab: b.dataset.tab }));
document.getElementById("brand").onclick = () => go({ tab: "accueil" });

// ---------- Sauvegarde ----------
function refreshSaveBox() { const box = document.getElementById("saveBox"); if (box && document.activeElement !== box) { try { box.value = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); } catch (e) { } } }
document.getElementById("copySave").onclick = () => { const box = document.getElementById("saveBox"); refreshSaveBox(); (navigator.clipboard ? navigator.clipboard.writeText(box.value) : Promise.reject()).then(() => toast("Code copié.")).catch(() => { box.select(); toast("Sélectionnez et copiez le code."); }); };
document.getElementById("restoreSave").onclick = () => { const box = document.getElementById("saveBox"); try { const s = JSON.parse(decodeURIComponent(escape(atob(box.value.trim())))); if (!s.cards) throw 0; state = normalize(s); save(); go({ tab: "accueil" }); toast("Progression restaurée."); } catch (e) { toast("Code illisible."); } };
let resetArmed = false;
document.getElementById("resetSave").onclick = e => { if (!resetArmed) { resetArmed = true; e.target.textContent = "Confirmer la remise à zéro"; setTimeout(() => { resetArmed = false; e.target.textContent = "Tout remettre à zéro"; }, 4000); return; } state = EMPTY(); save(); resetArmed = false; e.target.textContent = "Tout remettre à zéro"; go({ tab: "accueil" }); toast("Progression effacée."); };

// ---------- Démarrage ----------
load();
document.getElementById("buildInfo").textContent = `Version du ${DATA.build.date} · ${CHAPS.length} chapitres · ${Object.keys(EXO).length} exercices · ${Object.keys(CARTE).length} cartes de notions · ${PCG.length} comptes. Ce fichier fonctionne hors ligne : enregistrez-le et ouvrez-le avec un navigateur.`;
refreshSaveBox();
if (!state.stats.init) { checkSucces(true); state.stats.init = 1; persist(); }
updateSuccBadge();
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest(".fsrc a, .fiche table a, .fiche .small a"); if (a) { state.stats.src++; save(); } });
(function boot() {
  const h = (location.hash || "").slice(1);
  if (h === "expedition") go({ tab: "observatoire" });
  else if (["matieres", "fiches", "test", "revisions", "pcg", "observatoire", "succes"].includes(h)) go({ tab: h });
  else if (/^mue\d+$/.test(h) && UE_BY[h.slice(1).toUpperCase()]) go({ tab: "ue", code: h.slice(1).toUpperCase() });
  else if (CHAP_BY[h]) go({ tab: "chap", id: h });
  else go({ tab: "accueil" });
})();
</script>
